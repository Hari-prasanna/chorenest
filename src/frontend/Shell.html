<script>
// App shell: section navigation, the Beta notice, the profile entry and "Work in progress" pages.
// Data in, HTML strings out; no DOM access. Nothing here changes data or calls the server.
const TABS = ['schedule', 'vacation', 'swaps', 'history'];
const BETA_STORAGE_KEY = 'chorenest-beta-notice';
const BETA_NOTICE = 'Some issues may take longer to fix while the admin is away. Thanks for your patience!';
// How the signed-in roommate's role (from the server) is shown. It is a label only: the server decides what is allowed.
const ROLE_LABELS = { ADMIN: 'Admin', ROOMMATE: 'Roommate' };

function renderBetaNotice() {
  return '<div class="beta-notice-body"><p><strong>ChoreNest is in beta.</strong> ' + escapeHtml(BETA_NOTICE) + '</p>' +
    '<button class="button button-quiet" type="button" data-action="dismiss-beta">Got it</button></div>';
}

function roleLabel(viewer) {
  return Object.prototype.hasOwnProperty.call(ROLE_LABELS, viewer.role) ? ROLE_LABELS[viewer.role] : ROLE_LABELS.ROOMMATE;
}

// The top-right entry shows who is signed in, as the server reported it.
function renderProfileButton(viewer) {
  if (!viewer) return '';
  return avatar(viewer, 'sm') + '<span class="profile-text"><span class="profile-name">' + escapeHtml(displayName(viewer)) + '</span>' +
    '<span class="profile-state">' + escapeHtml(roleLabel(viewer)) + '</span></span>';
}

function profileLabel(viewer) {
  return viewer ? 'Profile: ' + displayName(viewer) + ', ' + roleLabel(viewer) : 'Profile';
}

function renderProfileDialog(viewer) {
  return '<div class="dialog-body"><h2 id="profile-title">Profile</h2>' +
    '<div class="profile-card">' + avatar(viewer, 'md') + '<div><p class="name">' + escapeHtml(displayName(viewer)) + '</p>' +
    '<p class="profile-role"><span class="badge badge-role">' + escapeHtml(roleLabel(viewer)) + '</span> · Signed in</p></div></div>' +
    (viewer.role === 'ADMIN'
      ? '<p class="profile-admin"><button class="button button-quiet profile-admin-button" type="button" data-action="open-admin">Manage household</button></p>'
      : '') +
    '<p class="profile-note">Signing out ends your session on all your devices.</p>' +
    '<div class="dialog-actions">' +
    '<button class="button button-quiet" type="button" data-action="sign-out">Sign out</button>' +
    '<button class="button" type="button" data-action="close-profile" autofocus>Close</button></div></div>';
}
</script>
