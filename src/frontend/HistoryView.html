<script>
// The History tab: cleaning records as a read-only table with a time range, pages and a CSV download.
// Data in, HTML strings out; no DOM access.
const HISTORY_OUTCOMES = {
  completed: { label: 'Cleaned', tone: 'ok' },
  vacation_skipped: { label: 'Skipped: away', tone: 'wait' },
  admin_resolved: { label: 'Closed by the app owner', tone: 'off' },
};
const HISTORY_RANGES = [
  { id: '14d', label: 'Last 14 days', empty: 'No cleanings in the last 14 days' },
  { id: '30d', label: 'Last 30 days', empty: 'No cleanings in the last 30 days' },
  { id: '90d', label: 'Last 90 days', empty: 'No cleanings in the last 90 days' },
  { id: 'all', label: 'All time', empty: 'No cleanings yet' },
];
const HISTORY_DEFAULT_RANGE = '14d';

function historyRangeOf(id) {
  return HISTORY_RANGES.filter(function (range) {
    return range.id === id;
  })[0] || HISTORY_RANGES[0];
}

function renderHistoryRow(entry) {
  const outcome = HISTORY_OUTCOMES[entry.outcome] || HISTORY_OUTCOMES.admin_resolved;
  return '<tr><th scope="row" class="history-weekend" data-label="Weekend">' + escapeHtml(formatWeekend(entry)) + '</th>' +
    '<td data-label="Roommate"><span class="history-person">' + avatar(entry.roommate, 'sm') + '<span class="name">' + escapeHtml(displayName(entry.roommate)) + '</span></span></td>' +
    '<td data-label="Status"><span class="badge badge-account tone-' + outcome.tone + '">' + escapeHtml(outcome.label) + '</span>' +
    (entry.swapped ? '<span class="history-sub">Swapped turn</span>' : '') + renderPhotoButtons(entry) + '</td>' +
    '<td data-label="Resolved">' + escapeHtml(formatTimestamp(entry.resolved_at)) + '</td></tr>';
}

// History and Leaderboard share the tab; this switches between them.
function renderHistorySections(section) {
  const option = function (id, label, iconName) {
    return '<button class="segment" type="button" data-action="history-section" data-section="' + id + '" aria-pressed="' + (id === section ? 'true' : 'false') + '">' +
      icon(iconName) + '<span>' + label + '</span></button>';
  };
  return '<div class="segmented" role="group" aria-label="History sections">' + option('log', 'History', 'list') + option('league', 'Leaderboard', 'trophy') + '</div>';
}

function renderHistoryFilters(view) {
  return '<div class="filter-bar" role="group" aria-label="Time range">' + HISTORY_RANGES.map(function (range) {
    return '<button class="chip" type="button" data-action="history-range" data-range="' + range.id + '" aria-pressed="' + (range.id === view.range ? 'true' : 'false') + '">' +
      escapeHtml(range.label) + '</button>';
  }).join('') + '</div>';
}

function renderHistoryPager(view) {
  if (view.pages < 2) return '';
  const first = (view.page - 1) * view.pageSize + 1;
  const last = first + view.entries.length - 1;
  return '<div class="pager" role="group" aria-label="History pages">' +
    '<button class="button button-quiet button-small" type="button" data-action="history-prev"' + (view.page <= 1 ? ' disabled' : '') + '>' + icon('left') + '<span>Previous</span></button>' +
    '<p class="pager-status">Page ' + escapeHtml(String(view.page)) + ' of ' + escapeHtml(String(view.pages)) + '<span class="history-sub">' +
    escapeHtml(first + '–' + last + ' of ' + view.total) + '</span></p>' +
    '<button class="button button-quiet button-small" type="button" data-action="history-next"' + (view.page >= view.pages ? ' disabled' : '') + '><span>Next</span>' + icon('right') + '</button></div>';
}

function renderHistoryTable(view) {
  return '<section class="card history-card" aria-labelledby="history-title"><h3 class="visually-hidden" id="history-title">' + escapeHtml(historyRangeOf(view.range).label) + '</h3>' +
    '<div class="table-wrap"><table class="history-table"><thead><tr><th scope="col">Cleaning weekend</th><th scope="col">Roommate</th><th scope="col">Status</th><th scope="col">Resolved</th></tr></thead>' +
    '<tbody>' + view.entries.map(renderHistoryRow).join('') + '</tbody></table></div></section>' + renderHistoryPager(view) +
    '<p class="footnote">Newest first · Times in Berlin</p>';
}

/**
 * view: { section: 'log' | 'league', status: 'loading' | 'ready' | 'error' | 'network', range, page, pages, total, pageSize,
 *         entries, exporting, notice: { kind, text } | null, league: { status, period, data } }
 */
function renderHistoryPanel(view) {
  if (view.section === 'league') {
    return '<div class="layout"><div class="vacation-top"><div><h2 class="panel-title">The Clean League</h2>' +
      '<p class="vacation-intro">Tidy weekends earn points. Friendly rivalry, zero judgment.</p></div></div>' +
      renderHistorySections('league') + renderLeagueBody(view.league) + '</div>';
  }
  let body;
  if (view.status === 'ready' && view.entries.length) {
    body = renderHistoryTable(view);
  } else if (view.status === 'ready') {
    const range = historyRangeOf(view.range);
    body = '<section class="card state state-compact"><h3>' + escapeHtml(range.empty) + '</h3><p>' +
      (view.range === 'all' ? 'Once a turn is marked as cleaned, it shows up here.' : 'Choose a longer range to see older cleanings.') + '</p></section>';
  } else if (view.status === 'error' || view.status === 'network') {
    body = '<section class="card state state-compact"><h3>Couldn’t load the history</h3><p>' +
      (view.status === 'network' ? 'Check your connection and try again.' : 'Try again in a moment.') + '</p>' +
      '<button class="button" type="button" data-action="retry-history">Try again</button></section>';
  } else {
    body = '<div role="status"><p class="eyebrow">Loading history…</p><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>';
  }
  const canDownload = view.status === 'ready' && view.total > 0 && !view.exporting;
  return '<div class="layout"><div class="vacation-top"><div><h2 class="panel-title">History</h2>' +
    '<p class="vacation-intro">The receipts: who cleaned, and which turns were skipped.</p></div>' +
    '<button class="button button-quiet" type="button" data-action="download-history"' + (canDownload ? '' : ' disabled') + '>' +
    icon('download') + '<span>' + (view.exporting ? 'Preparing…' : 'Download CSV') + '</span></button></div>' +
    renderHistorySections('log') + renderHistoryFilters(view) +
    (view.notice ? '<p class="notice notice-' + escapeHtml(view.notice.kind) + '" role="alert">' + escapeHtml(view.notice.text) + '</p>' : '') +
    body + '</div>';
}

function isValidHistory(result) {
  const whole = function (value) {
    return typeof value === 'number' && value >= 0 && value === Math.floor(value);
  };
  return Boolean(result) && result.ok === true && Array.isArray(result.entries) &&
    HISTORY_RANGES.some(function (range) {
      return range.id === result.range;
    }) && whole(result.page) && whole(result.pages) && whole(result.total) && whole(result.page_size) && result.page >= 1 && result.pages >= 1 &&
    result.entries.every(function (entry) {
      return Boolean(entry) && Boolean(entry.roommate) && typeof entry.roommate.roommate_id === 'string' &&
        typeof entry.outcome === 'string' && !isNaN(Date.parse(entry.weekend_starts_at)) && !isNaN(Date.parse(entry.due_at)) && !isNaN(Date.parse(entry.resolved_at));
    });
}

function isValidHistoryExport(result) {
  return Boolean(result) && result.ok === true && typeof result.csv === 'string' && typeof result.filename === 'string' && /^[A-Za-z0-9._-]{1,80}$/.test(result.filename);
}
</script>
