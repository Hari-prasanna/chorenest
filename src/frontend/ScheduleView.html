<script>
// View helpers: schedule data in, HTML strings out. They never touch the DOM, so Node tests can run them.
const TIME_ZONE = 'Europe/Berlin';
const TASK_NAME = 'Entire Home';

const SHORT_DAY = { weekday: 'short', day: 'numeric', month: 'short' };
const LONG_DAY = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
const TIMESTAMP = { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' };

const STATUS_LABELS = { pending: 'Pending', overdue: 'Overdue', waiting: 'Upcoming' };
const STATUS_GLYPHS = { pending: '●', overdue: '!', waiting: '○' };
const STATUS_MESSAGES = {
  pending: 'Time to give the nest some love.',
  overdue: 'Overdue: the nest is waiting for this one.',
  waiting: 'Not open yet. Enjoy the break.',
};
const STEP_LABELS = ['Up next', 'Then', 'After that'];
const AVATAR_TONES = 6;
const CONFIG_CODES = [
  'CONFIG_INVALID',
  'SPREADSHEET_UNAVAILABLE',
  'DATABASE_NOT_SET_UP',
  'DATABASE_ENVIRONMENT_MISMATCH',
  'TIMEZONE_MISMATCH',
  'SCHEMA_INVALID',
];

const formatters = {};

function berlinParts(ms, options) {
  const key = JSON.stringify(options);
  formatters[key] = formatters[key] || new Intl.DateTimeFormat('en-GB', Object.assign({ timeZone: TIME_ZONE }, options));
  const parts = {};
  formatters[key].formatToParts(new Date(ms)).forEach(function (part) {
    parts[part.type] = part.value;
  });
  return parts;
}

// due_at is an exclusive Monday 00:00 boundary, so the last day of the weekend is one millisecond earlier.
function lastDayMs(turn) {
  return Date.parse(turn.due_at) - 1;
}

function formatWeekend(turn) {
  const saturday = berlinParts(Date.parse(turn.weekend_starts_at), SHORT_DAY);
  const sunday = berlinParts(lastDayMs(turn), SHORT_DAY);
  const start = saturday.weekday + ' ' + saturday.day + (saturday.month === sunday.month ? '' : ' ' + saturday.month);
  return start + ' – ' + sunday.weekday + ' ' + sunday.day + ' ' + sunday.month;
}

function formatDueDay(turn) {
  const day = berlinParts(lastDayMs(turn), LONG_DAY);
  return day.weekday + ' ' + day.day + ' ' + day.month + ' ' + day.year;
}

function formatTimestamp(iso) {
  const time = berlinParts(Date.parse(iso), TIMESTAMP);
  return time.weekday + ' ' + time.day + ' ' + time.month + ', ' + time.hour + ':' + time.minute;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function (character) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
  });
}

// Line icons, drawn in the text colour. Decorative only: every icon sits next to words, so it is hidden from screen readers.
const ICON_PATHS = {
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  luggage: '<rect x="4" y="7.5" width="16" height="12.5" rx="2.5"/><path d="M9 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5v2M9 11.5v5M15 11.5v5"/>',
  swap: '<path d="M7 4 3.5 7.5 7 11M3.5 7.5H17M17 13l3.5 3.5L17 20M20.5 16.5H7"/>',
  history: '<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5M12 7.5V12l3 2"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  download: '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/>',
  edit: '<path d="M4.5 19.5h4l10-10-4-4-10 10v4ZM13 7.5l3.5 3.5"/>',
  camera: '<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z"/><circle cx="12" cy="13" r="3.2"/>',
  image: '<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.6"/><path d="m4 17 5-4.5 3.5 3L15 13l5 4.5"/>',
  trash: '<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.9 12.1a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4L17.5 7M9.5 7V4.5h5V7"/>',
  home: '<path d="M4 11 12 4.5l8 6.5M6 9.5v10h12v-10"/><path d="M10 19.5v-5h4v5"/>',
  person: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
  personAdd: '<circle cx="9.5" cy="8.5" r="3.5"/><path d="M3 20a6.5 6.5 0 0 1 13 0M18.5 8v6M15.5 11h6"/>',
  shield: '<path d="M12 3.5 5.5 6v5.5c0 4 2.8 7.3 6.5 8.7 3.7-1.4 6.5-4.7 6.5-8.7V6Z"/>',
  signOut: '<path d="M14.5 4.5h4v15h-4M10 8l-4 4 4 4M6 12h10"/>',
  left: '<path d="m14.5 6-6 6 6 6"/>',
  right: '<path d="m9.5 6 6 6-6 6"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3M12 13v4M8.5 20h7M10 17h4"/>',
  streak: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6Z"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
};

function icon(name) {
  return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + (ICON_PATHS[name] || '') + '</svg>';
}

function displayName(person) {
  return person.name || 'Unknown roommate';
}

// The bundled avatars: a line glyph on one of the six warm tones. The IDs must match AVATAR_IDS in Schema.js (a test
// checks it). A roommate who has not picked one shows an initial. Nothing is loaded from outside.
const AVATARS = [
  { id: 'sun', label: 'Sun', tone: 1, glyph: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>' },
  { id: 'moon', label: 'Moon', tone: 6, glyph: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>' },
  { id: 'bolt', label: 'Bolt', tone: 2, glyph: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6Z"/>' },
  { id: 'flame', label: 'Flame', tone: 5, glyph: '<path d="M12 3c.6 3.4 5.5 5.4 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2 .9-3.4 2.1-4.4.2 1.5.9 2.3 1.7 2.7C10.1 8.7 10.3 5.4 12 3Z"/><path d="M12 20.5c-1.5 0-2.5-1-2.5-2.4 0-1.2.8-2 1.5-2.7.2.8.6 1.2 1 1.4.5-.6.6-1.3.5-2 1.3.8 2 1.9 2 3.3 0 1.5-1 2.4-2.5 2.4Z"/>' },
  { id: 'wave', label: 'Wave', tone: 4, glyph: '<path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0"/>' },
  { id: 'peak', label: 'Peak', tone: 3, glyph: '<path d="M3 19 9.5 7l4 7 2-3L21 19Z"/>' },
  { id: 'star', label: 'Star', tone: 1, glyph: '<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.9Z"/>' },
  { id: 'drop', label: 'Drop', tone: 4, glyph: '<path d="M12 3.5C8 8.5 6 11.3 6 14.5a6 6 0 0 0 12 0c0-3.2-2-6-6-11Z"/>' },
];

// Who picked which avatar, from the latest schedule answer (and updated when someone's profile or the own pick changes).
// Every view draws avatars through this, so a pick shows everywhere at once.
let avatarDirectory = {};

function avatarSpec(id) {
  return AVATARS.filter(function (avatar) {
    return avatar.id === id;
  })[0] || null;
}

function setAvatarDirectory(roommates) {
  avatarDirectory = {};
  roommates.forEach(function (roommate) {
    if (avatarSpec(roommate.avatar)) avatarDirectory[roommate.roommate_id] = roommate.avatar;
  });
}

function setAvatarFor(roommateId, avatarId) {
  if (avatarSpec(avatarId)) avatarDirectory[roommateId] = avatarId;
  else delete avatarDirectory[roommateId];
}

// A stable colour per roommate, so each person keeps the same avatar everywhere.
function avatarTone(person) {
  let hash = 0;
  Array.from(person.roommate_id).forEach(function (character) {
    hash = (hash * 31 + character.charCodeAt(0)) >>> 0;
  });
  return (hash % AVATAR_TONES) + 1;
}

function avatar(person, size) {
  const picked = Object.prototype.hasOwnProperty.call(avatarDirectory, person.roommate_id) ? avatarSpec(avatarDirectory[person.roommate_id]) : null;
  if (picked) {
    return '<span class="avatar avatar-' + size + ' tone-' + picked.tone + '" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      picked.glyph + '</svg></span>';
  }
  const initial = Array.from(displayName(person))[0].toUpperCase();
  return '<span class="avatar avatar-' + size + ' tone-' + avatarTone(person) + '" aria-hidden="true">' + escapeHtml(initial) + '</span>';
}

function joinNames(names) {
  if (names.length < 2) return names.join('');
  return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
}

// `inline` notes are spans, for use inside a button (a paragraph is not allowed there).
function renderNote(iconName, text, inline) {
  const tag = inline ? 'span' : 'p';
  return '<' + tag + ' class="note">' + icon(iconName) + '<span>' + escapeHtml(text) + '</span></' + tag + '>';
}

// At most one swap note and one vacation note per turn, in plain words.
function turnNotes(turn, inline) {
  const notes = [];
  if (turn.assignee.roommate_id !== turn.owner.roommate_id) {
    notes.push(renderNote('swap', 'Covering for ' + displayName(turn.owner) + ' (swap).', inline));
  }
  if (turn.vacation_conflict_id) {
    notes.push(renderNote('luggage', displayName(turn.assignee) + ' is away, so this turn will be skipped.', inline));
  } else if (turn.skipped.length) {
    notes.push(renderNote('luggage', joinNames(turn.skipped.map(displayName)) + (turn.skipped.length > 1 ? ' are' : ' is') + ' away.', inline));
  }
  return notes.join('');
}

const COMING_UP_COUNT = 3;

/**
 * The next distinct turns for "Coming up": later than the current one, each weekend once, in order. Only the exact
 * current assignment is left out; the same roommate may appear again on a later weekend.
 */
function subsequentTurns(schedule) {
  const current = schedule.current;
  const dueAt = Date.parse(current.due_at);
  const seen = {};
  return schedule.upcoming.filter(function (turn) {
    const key = turn.rotation_id + '|' + turn.due_at;
    if (Date.parse(turn.due_at) <= dueAt || seen[key]) return false;
    seen[key] = true;
    return true;
  }).slice(0, COMING_UP_COUNT);
}

// The signed-in roommate (from the server) decides which actions the page offers; one missing from the roster gets none.
function validSelection(schedule, roommateId) {
  return schedule.roommates.some(function (roommate) {
    return roommate.roommate_id === roommateId;
  }) ? roommateId : null;
}

function rosterName(schedule, roommateId) {
  const roommate = schedule.roommates.find(function (candidate) {
    return candidate.roommate_id === roommateId;
  });
  return roommate ? displayName(roommate) : 'there';
}

// The button is offered to the signed-in assignee. The server checks the session and the turn again.
function markableTurn(schedule, selectedId) {
  const current = schedule.current;
  const open = current.status === 'pending' || current.status === 'overdue';
  return validSelection(schedule, selectedId) && open && current.assignee.roommate_id === selectedId ? current : null;
}

function renderMarkAction(canMark) {
  return canMark ? '<button class="button mark-button" type="button" data-action="mark-cleaned">' + icon('check') + '<span>Mark as cleaned</span></button>' : '';
}

function renderConfirmDialog(schedule, selectedId) {
  return '<div class="dialog-body">' +
    '<h2 id="confirm-title">Mark ' + escapeHtml(TASK_NAME) + ' as cleaned?</h2>' +
    '<p>' + escapeHtml(rosterName(schedule, selectedId)) + ', you’re telling everyone the whole home is clean. ' +
    'It’s saved for the household and can’t be undone from the app.</p>' +
    '<div class="dialog-actions">' +
    '<button class="button" type="button" data-action="confirm-clean">Yes, it’s clean</button>' +
    '<button class="button button-quiet" type="button" data-action="cancel-clean" autofocus>Not yet</button></div></div>';
}

function renderSaving() {
  return '<div class="dialog-body" role="status"><h2 id="confirm-title">Saving…</h2></div>';
}

const CLEAN_ERROR_MESSAGES = {
  NOT_YOUR_TURN: 'It isn’t your turn right now, so nothing was saved.',
  STALE_TURN: 'The schedule changed while you were looking. Here’s the latest.',
  ALREADY_RECORDED: 'That turn was already marked as done. Here’s the latest.',
  TURN_NOT_OPEN: 'That turn isn’t open yet, so nothing was saved.',
  BUSY: 'Someone else is saving right now. Please try again in a moment.',
  WRITE_FAILED: 'We couldn’t save that. Nothing was recorded, so you can try again.',
};

function unknownCleanNotice() {
  return { kind: 'info', text: 'We couldn’t confirm that it saved. Check the schedule below before trying again.' };
}

function cleanNotice(result, name) {
  if (result && result.ok === true) return { kind: 'success', text: 'Nice work, ' + name + '! ' + TASK_NAME + ' is marked as cleaned.' };
  if (result && result.ok === false && result.error) {
    return { kind: 'error', text: CLEAN_ERROR_MESSAGES[result.error.code] || 'Something went wrong, so nothing was saved. Try again.' };
  }
  return unknownCleanNotice();
}

function renderNotice(notice) {
  return '<p class="notice notice-' + escapeHtml(notice.kind) + '" role="' + (notice.kind === 'error' ? 'alert' : 'status') + '">' +
    escapeHtml(notice.text) + '</p>';
}

function renderBadge(status) {
  const known = Boolean(STATUS_LABELS[status]);
  return '<span class="badge badge-' + (known ? status : 'waiting') + '"><span aria-hidden="true">' +
    (STATUS_GLYPHS[status] || STATUS_GLYPHS.waiting) + '</span>' + escapeHtml(known ? STATUS_LABELS[status] : status) + '</span>';
}

function renderCurrentTurn(turn, canMark) {
  const status = STATUS_LABELS[turn.status] ? turn.status : 'waiting';
  const overdue = status === 'overdue';
  return '<section class="card hero' + (overdue ? ' is-overdue' : '') + '" aria-labelledby="current-title">' +
    '<div class="hero-top"><h2 class="eyebrow" id="current-title">Current turn</h2>' + renderBadge(turn.status) + '</div>' +
    '<div class="hero-person">' + avatar(turn.assignee, 'lg') +
    '<div class="person-text"><p class="name">' + escapeHtml(displayName(turn.assignee)) + '</p>' +
    '<p class="task">' + escapeHtml(TASK_NAME) + '</p></div></div>' +
    '<p class="message">' + escapeHtml(STATUS_MESSAGES[status]) + '</p>' +
    '<dl class="facts">' +
    '<div><dt>Cleaning weekend</dt><dd>' + escapeHtml(formatWeekend(turn)) + '</dd></div>' +
    '<div><dt>' + (overdue ? 'Was due' : 'Due') + '</dt><dd>' + escapeHtml('End of ' + formatDueDay(turn)) + '</dd></div></dl>' +
    turnNotes(turn) +
    '<div id="mark-action">' + renderMarkAction(canMark) + '</div></section>';
}

/**
 * "Coming up": one compact card per upcoming turn, each opening that roommate's profile. The same roommate may appear
 * again on a later weekend. Only the assignee's ID goes in the card; the profile is asked from the server on tap.
 */
function renderUpcomingTurns(turns) {
  if (!turns.length) return '';
  const items = turns.map(function (turn, index) {
    return '<li><button class="member-card" type="button" data-action="open-member" data-roommate-id="' + escapeHtml(turn.assignee.roommate_id) + '">' +
      avatar(turn.assignee, 'xl') +
      '<span class="member-card-body"><span class="member-card-top"><span class="name">' + escapeHtml(displayName(turn.assignee)) + '</span>' +
      '<span class="step' + (index === 0 ? ' is-next' : '') + '">' + escapeHtml(STEP_LABELS[index] || 'Later') + '</span></span>' +
      '<span class="when">' + escapeHtml(formatWeekend(turn)) + '</span>' + turnNotes(turn, true) + '</span></button></li>';
  }).join('');
  return '<section class="card upcoming" aria-labelledby="upcoming-title">' +
    '<h2 class="eyebrow section-title" id="upcoming-title">' + icon('calendar') + 'Coming up</h2><ol class="member-grid">' + items + '</ol></section>';
}

// One current-turn card, then "Who's away" (filled in by the page when vacations arrive) and the turns after it.
function renderSchedule(schedule, selectedId, notice, away, prompt) {
  return '<div class="layout">' + (notice ? renderNotice(notice) : '') +
    renderCurrentTurn(schedule.current, markableTurn(schedule, selectedId) !== null) +
    '<div class="slot" id="photo-prompt-slot">' + (prompt || '') + '</div>' +
    '<div id="away-slot">' + renderAwaySummary(away || { status: 'loading', vacations: [], nowMs: Date.now() }) + '</div>' +
    renderUpcomingTurns(subsequentTurns(schedule)) +
    '<p class="footnote">Updated ' + escapeHtml(formatTimestamp(schedule.generated_at)) + ' · Times in Berlin</p></div>';
}

function renderLoading() {
  return '<div class="layout" role="status"><p class="eyebrow">Loading schedule…</p>' +
    '<div class="skeleton skeleton-hero"></div>' +
    '<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>';
}

function renderState(title, message, code) {
  return '<section class="card state">' +
    '<h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(message) + '</p>' +
    '<button class="button" type="button" data-action="retry">Try again</button>' +
    (code ? '<p class="code">Error code: ' + escapeHtml(code) + '</p>' : '') + '</section>';
}

// Server messages can name configuration details, so visitors only get a code and a plain explanation.
function renderProblem(code) {
  if (code === 'ROTATION_EMPTY') {
    return renderState('No rotation yet', 'Once roommates are added to the rotation, the cleaning schedule will appear here.');
  }
  if (CONFIG_CODES.indexOf(code) !== -1) {
    return renderState('ChoreNest isn’t set up correctly', 'Ask the app owner to check the configuration, then try again.', code);
  }
  if (code === 'ROTATION_DATA_INVALID') {
    return renderState('The rotation data needs attention', 'Something in the rotation records isn’t valid. Ask the app owner to check the Google Sheet.', code);
  }
  if (code === 'REQUEST_FAILED') {
    return renderState('Couldn’t reach the server', 'Check your connection and try again.', code);
  }
  return renderState('Something went wrong', 'Try again in a moment.', code);
}

function isValidPerson(person) {
  return Boolean(person) && typeof person.roommate_id === 'string';
}

function isValidTurn(turn) {
  return Boolean(turn) && isValidPerson(turn.owner) && isValidPerson(turn.assignee) && Array.isArray(turn.skipped) &&
    turn.skipped.every(isValidPerson) && !isNaN(Date.parse(turn.weekend_starts_at)) && !isNaN(Date.parse(turn.due_at));
}

function isValidSchedule(result) {
  return Boolean(result) && result.ok === true && isValidTurn(result.current) && typeof result.current.status === 'string' &&
    Array.isArray(result.upcoming) && result.upcoming.every(isValidTurn) && !isNaN(Date.parse(result.generated_at)) &&
    Array.isArray(result.roommates) && result.roommates.every(isValidPerson);
}

function renderResult(result, selectedId, notice, away, prompt) {
  if (result && result.ok === false && result.error) return renderProblem(result.error.code);
  return isValidSchedule(result) ? renderSchedule(result, selectedId, notice, away, prompt) : renderProblem('UNEXPECTED_RESPONSE');
}
</script>
