<style>
  /* Colour tokens: the only place colours are defined. Dark overrides the light values. */
  :root {
    color-scheme: light;
    --bg: #fbf8f3;
    --surface: #ffffff;
    --surface-soft: #f3efe7;
    --text: #172a33;
    --muted: #55646d;
    --border: #e6e0d4;
    --timeline: #cfe5d8;
    --solid: #2f6b55;
    --solid-hover: #275c48;
    --on-solid: #ffffff;
    --accent: #6bb38c;
    --accent-soft: #e3f1e9;
    --accent-text: #24563f;
    --neutral-bg: #eee9df;
    --neutral-text: #4d5a62;
    --note-bg: #f3efe7;
    --focus: #2f6b55;
    --shadow: 0 1px 2px rgba(23, 42, 51, 0.05), 0 4px 14px rgba(23, 42, 51, 0.05);
    --shadow-hero: 0 2px 6px rgba(23, 42, 51, 0.08), 0 10px 28px rgba(23, 42, 51, 0.1);
    --backdrop: rgba(14, 21, 29, 0.55);

    /* Hero card: the current cleaner, in one soft green. Overdue swaps in the coral set. */
    --hero-bg: #2f6b55;
    --on-hero: #ffffff;
    --on-hero-soft: #e6f3ec;
    --hero-ring: rgba(255, 255, 255, 0.45);
    --hero-tile: #eef7f1;
    --hero-tile-text: #173b2c;
    --hero-tile-muted: #3a6652;
    --overdue-bg: #a4422f;
    --overdue-tile: #fdf0ec;
    --overdue-tile-text: #4a150c;
    --overdue-tile-muted: #843626;

    --tone-1-bg: #d3f1e5;
    --tone-1-fg: #14573f;
    --tone-2-bg: #d9eafa;
    --tone-2-fg: #1d4e7a;
    --tone-3-bg: #fde3d0;
    --tone-3-fg: #8a4313;
    --tone-4-bg: #e6dff7;
    --tone-4-fg: #4a3a8a;
    --tone-5-bg: #faedbd;
    --tone-5-fg: #6b5300;
    --tone-6-bg: #f9dbe3;
    --tone-6-fg: #8a2a47;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e151d;
    --surface: #162230;
    --surface-soft: #1d2c3b;
    --text: #e9f1f6;
    --muted: #9db1c0;
    --border: #27384a;
    --timeline: #2a4a3b;
    --solid: #8fd3ae;
    --solid-hover: #b0e3c6;
    --on-solid: #0f2a1e;
    --accent: #6fc196;
    --accent-soft: #1a3529;
    --accent-text: #a6dfbf;
    --neutral-bg: #223244;
    --neutral-text: #c6d4df;
    --note-bg: #1b2a39;
    --focus: #a6dfbf;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    --shadow-hero: 0 2px 6px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.35);
    --backdrop: rgba(0, 0, 0, 0.65);

    --hero-bg: #22503f;
    --on-hero: #ffffff;
    --on-hero-soft: #d8efe2;
    --hero-ring: rgba(255, 255, 255, 0.28);
    --hero-tile: #143326;
    --hero-tile-text: #e9f1f6;
    --hero-tile-muted: #a9d6bd;
    --overdue-bg: #7a2e22;
    --overdue-tile: #3a1a17;
    --overdue-tile-text: #ffe8e3;
    --overdue-tile-muted: #f0b3a6;

    --tone-1-bg: #17382f;
    --tone-1-fg: #9be0b2;
    --tone-2-bg: #1f3347;
    --tone-2-fg: #a6d0f5;
    --tone-3-bg: #46301f;
    --tone-3-fg: #f5c49c;
    --tone-4-bg: #332c4d;
    --tone-4-fg: #c9bdf2;
    --tone-5-bg: #453a14;
    --tone-5-fg: #f1dc8a;
    --tone-6-bg: #4a2733;
    --tone-6-fg: #f5b8c8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  button {
    font: inherit;
  }

  [hidden] {
    display: none !important;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 16px 104px;
  }

  /* Header */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 8px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .logo {
    width: 36px;
    height: 36px;
  }

  .logo-bg {
    fill: var(--solid);
  }

  .logo-mark {
    fill: var(--on-solid);
  }

  .logo-door {
    fill: var(--solid);
  }

  .env-badge {
    padding: 2px 10px;
    border-radius: 999px;
    background: #b45309;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .beta-badge {
    padding: 1px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--neutral-bg);
    color: var(--neutral-text);
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .top-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .profile {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
    min-height: 44px;
    padding: 4px 14px 4px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    text-align: left;
    cursor: pointer;
  }

  .profile-text {
    display: grid;
    min-width: 0;
    line-height: 1.2;
  }

  .profile-name {
    overflow: hidden;
    max-width: 9rem;
    font-size: 0.875rem;
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .profile-state {
    color: var(--muted);
    font-size: 0.75rem;
  }

  .theme-toggle {
    display: inline-flex;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .theme-toggle button {
    min-height: 34px;
    padding: 2px 14px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
  }

  .theme-toggle button[aria-pressed="true"] {
    background: var(--solid);
    color: var(--on-solid);
    font-weight: 700;
  }

  /* Section navigation: a bottom bar on phones, a row under the header on wider screens */
  .tabs {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 5;
    display: flex;
    gap: 4px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .tab {
    flex: 1 1 0;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 2px;
    min-height: 52px;
    padding: 4px 2px;
    border: 0;
    border-radius: 16px;
    background: transparent;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }

  .tab-icon {
    font-size: 1.25rem;
    line-height: 1;
  }

  .tab[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: 700;
  }

  .beta-notice {
    margin: 4px 0 14px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--note-bg);
    color: var(--text);
  }

  .beta-notice-body {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }

  .beta-notice p {
    flex: 1 1 16rem;
    margin: 0;
  }

  .panel-title {
    margin: 0 0 12px;
    font-size: 1.5rem;
    letter-spacing: -0.02em;
  }

  .wip .panel-title {
    margin-bottom: 8px;
  }

  .wip-badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    background: var(--neutral-bg);
    color: var(--neutral-text);
    font-size: 0.8125rem;
    font-weight: 700;
  }

  .who-note {
    margin: 0;
    color: var(--muted);
    font-size: 0.8125rem;
  }

  /* Cards */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
  }

  /* One card style everywhere: same radius, border and shadow. */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin: 0;
    color: var(--muted);
    font-size: 0.8125rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .name {
    margin: 0;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  /* Hero: the current cleaner */
  .hero {
    --hero: var(--hero-bg);
    --tile: var(--hero-tile);
    --tile-text: var(--hero-tile-text);
    --tile-muted: var(--hero-tile-muted);
    padding: 18px;
    border: 0;
    background: var(--hero);
    color: var(--on-hero);
    box-shadow: var(--shadow-hero);
  }

  .hero.is-overdue {
    --hero: var(--overdue-bg);
    --tile: var(--overdue-tile);
    --tile-text: var(--overdue-tile-text);
    --tile-muted: var(--overdue-tile-muted);
  }

  /* "Cleaning impact" on a vacation card: folded away until asked for */
  .impact {
    margin-top: 10px;
  }

  .impact summary {
    width: fit-content;
    min-height: 32px;
    padding: 4px 0;
    color: var(--accent-text);
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
  }

  .impact .chips {
    margin-top: 6px;
  }

  .hero .eyebrow {
    color: var(--on-hero-soft);
  }

  .hero-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .hero-person {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 12px 0 10px;
  }

  .person-text {
    flex: 1 1 auto;
    min-width: 0;
  }

  .hero .name {
    font-size: clamp(1.75rem, 7vw, 2.5rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
  }

  .task {
    margin: 4px 0 0;
    color: var(--on-hero-soft);
    font-weight: 600;
  }

  .message {
    margin: 0 0 12px;
    font-size: 1.0625rem;
    font-weight: 700;
    text-wrap: balance;
  }

  .hero .facts {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .hero .facts > div {
    padding: 10px 12px;
    border-radius: 14px;
    background: var(--tile);
  }

  .hero .facts dt {
    color: var(--tile-muted);
  }

  .hero .facts dd {
    color: var(--tile-text);
  }

  .hero .badge,
  .hero .note {
    background: var(--tile);
    color: var(--tile-text);
  }

  /* Avatars */
  .avatar {
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-weight: 800;
  }

  .avatar-lg {
    width: 60px;
    height: 60px;
    font-size: 1.625rem;
    box-shadow: 0 0 0 4px var(--hero-ring);
  }

  .avatar-sm {
    width: 32px;
    height: 32px;
    font-size: 0.9375rem;
  }

  .avatar-none {
    background: var(--neutral-bg);
    color: var(--neutral-text);
  }

  .avatar-md {
    width: 40px;
    height: 40px;
    font-size: 1.0625rem;
  }

  .tone-1 { background: var(--tone-1-bg); color: var(--tone-1-fg); }
  .tone-2 { background: var(--tone-2-bg); color: var(--tone-2-fg); }
  .tone-3 { background: var(--tone-3-bg); color: var(--tone-3-fg); }
  .tone-4 { background: var(--tone-4-bg); color: var(--tone-4-fg); }
  .tone-5 { background: var(--tone-5-bg); color: var(--tone-5-fg); }
  .tone-6 { background: var(--tone-6-bg); color: var(--tone-6-fg); }

  /* Status and step chips */
  .badge,
  .step {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.8125rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .step {
    background: var(--neutral-bg);
    color: var(--neutral-text);
  }

  .step.is-next {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  /* Facts and notes */
  .facts {
    display: grid;
    gap: 10px;
    margin: 0;
  }

  .facts dt {
    font-size: 0.8125rem;
    font-weight: 600;
  }

  .facts dd {
    margin: 2px 0 0;
    font-weight: 700;
  }

  .note {
    display: flex;
    gap: 8px;
    margin: 12px 0 0;
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--note-bg);
    font-size: 0.9375rem;
  }

  .note-icon {
    flex: none;
  }

  /* Rotation timeline */
  .section-title {
    margin: 0 0 12px;
  }

  .timeline {
    display: grid;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .timeline-item {
    position: relative;
    display: flex;
    gap: 14px;
    padding: 0 0 20px;
  }

  .timeline-item:last-child {
    padding-bottom: 0;
  }

  .timeline-item:not(:last-child)::before {
    content: "";
    position: absolute;
    top: 44px;
    bottom: 2px;
    left: 19px;
    width: 2px;
    border-radius: 2px;
    background: var(--timeline);
  }

  .timeline .avatar {
    box-shadow: 0 0 0 4px var(--surface);
  }

  .timeline-body {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    min-width: 0;
    padding-top: 1px;
  }

  .timeline-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
  }

  .timeline .name {
    font-size: 1.0625rem;
  }

  .when {
    display: inline-block;
    margin: 0;
    padding: 3px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-soft);
    font-size: 0.875rem;
    font-weight: 600;
  }

  .timeline .note {
    flex-basis: 100%;
    margin-top: 2px;
    font-size: 0.875rem;
  }

  .footnote {
    margin: 0;
    color: var(--muted);
    font-size: 0.8125rem;
    text-align: center;
  }

  /* Empty and error states */
  .state {
    padding: 40px 20px;
    text-align: center;
  }

  .state-icon {
    display: block;
    margin-bottom: 8px;
    font-size: 2.5rem;
  }

  .state h2 {
    margin: 0 0 8px;
    font-size: 1.25rem;
  }

  .state p {
    margin: 0 auto 16px;
    max-width: 32rem;
    color: var(--muted);
  }

  .state .code {
    margin: 16px 0 0;
    font-size: 0.8125rem;
  }

  .button {
    min-height: 44px;
    padding: 10px 24px;
    border: 0;
    border-radius: 999px;
    background: var(--solid);
    color: var(--on-solid);
    font-weight: 700;
    cursor: pointer;
  }

  .button-quiet {
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--text);
  }

  .mark-button {
    width: 100%;
    margin-top: 14px;
    background: var(--tile);
    color: var(--tile-text);
    font-size: 1.0625rem;
  }

  /* Banner after saving, and the confirmation dialog */
  .notice {
    margin: 0;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 18px;
    font-weight: 600;
  }

  .notice-success {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .notice-info {
    background: var(--note-bg);
    color: var(--text);
  }

  .notice-error {
    background: var(--overdue-tile);
    color: var(--overdue-tile-text);
  }

  .dialog {
    width: min(92vw, 420px);
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-hero);
  }

  .dialog::backdrop {
    background: var(--backdrop);
  }

  .dialog-body {
    padding: 28px 24px 24px;
    text-align: center;
  }

  .dialog-emoji {
    margin: 0 0 6px;
    font-size: 2.5rem;
  }

  .dialog-body h2 {
    margin: 0 0 8px;
    font-size: 1.375rem;
    letter-spacing: -0.01em;
  }

  .dialog-body p {
    margin: 0 auto 20px;
    color: var(--muted);
  }

  .dialog-actions {
    display: grid;
    gap: 10px;
  }

  /* Vacations: an inline overview of cards, grouped by state */
  .vacation-top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }

  .vacation-top .panel-title {
    margin-bottom: 2px;
  }

  .vacation-intro {
    margin: 0;
    color: var(--muted);
  }

  .vacation-group .section-title {
    margin-bottom: 10px;
  }

  .vacation-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .vacation-head {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .vacation-head .name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 1.0625rem;
  }

  .badge-away {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .badge-upcoming {
    background: var(--neutral-bg);
    color: var(--neutral-text);
  }

  .badge-returned {
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--muted);
  }

  .vacation-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 24px;
    margin: 10px 0 0;
  }

  .vacation-facts dt {
    color: var(--muted);
    font-size: 0.8125rem;
    font-weight: 600;
  }

  .vacation-facts dd {
    margin: 2px 0 0;
    font-weight: 700;
  }

  .vacation-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .button-small {
    min-height: 40px;
    padding: 6px 16px;
    font-size: 0.9375rem;
  }

  .button[disabled] {
    cursor: not-allowed;
    color: var(--muted);
  }

  .state-compact {
    padding: 24px 18px;
  }

  .state-compact h3 {
    margin: 0 0 6px;
    font-size: 1.125rem;
  }

  /* "Who's away" on the Schedule page */
  .away-card {
    padding: 14px 18px;
  }

  .away-list {
    display: grid;
    gap: 8px;
    margin: 10px 0 0;
    padding: 0;
    list-style: none;
  }

  .away-item {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
  }

  .away-item .name {
    font-size: 0.9375rem;
  }

  .away-when {
    color: var(--muted);
    font-size: 0.875rem;
  }

  .away-empty {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.9375rem;
  }

  .dialog-wide {
    width: min(94vw, 520px);
  }

  .dialog-scroll {
    max-height: 82vh;
    overflow-y: auto;
    text-align: left;
  }

  .dialog-scroll .dialog-actions {
    margin-top: 16px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
  }

  .chip {
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--neutral-bg);
    color: var(--neutral-text);
    font-size: 0.8125rem;
    font-weight: 600;
  }

  .chip-skipped {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .vacation-note {
    margin: 12px 0 0;
    color: var(--muted);
  }

  .field {
    display: grid;
    gap: 6px;
    margin-top: 14px;
  }

  .field label {
    color: var(--muted);
