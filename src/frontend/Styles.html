<style>
  /*
   * Design tokens: the only place colours are defined, plus the type scale, spacing, radii and borders every component
   * uses. Light values first; the one dark block overrides colours only. Black, warm yellow and quiet neutrals.
   */
  :root {
    color-scheme: light;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --fs-xs: 0.75rem;
    --fs-sm: 0.8125rem;
    --fs-md: 0.9375rem;
    --fs-base: 1rem;
    --fs-lg: 1.125rem;
    --fs-xl: 1.375rem;
    --fs-hero: clamp(1.75rem, 7vw, 2.375rem);
    --weight-medium: 600;
    --weight-bold: 700;
    --weight-heavy: 800;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-pill: 999px;
    --border-width: 1px;
    --tap: 44px;

    /* Page, surfaces and text */
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface-soft: #f1efea;
    --surface-raised: #ffffff;
    --text: #141414;
    --muted: #5b574f;
    --border: #e4e1da;
    --hover-bg: #ebe8e1;
    --input-bg: #ffffff;
    --input-border: #cfcac0;
    --focus: #141414;

    /* Brand: primary actions are warm yellow with black text in both themes */
    --solid: #f5c542;
    --solid-hover: #e9b52c;
    --on-solid: #141210;
    --accent: #f2c037;
    --accent-soft: #fbefc7;
    --accent-text: #684d00;
    --neutral-bg: #eeece6;
    --neutral-text: #46423b;
    --note-bg: #f4f2ec;
    --tab-active-bg: #fbefc7;
    --tab-active-text: #141414;

    /* Meaning: success, warning and error (the only non-brand hues) */
    --success-bg: #e2f1e5;
    --success-text: #1d5a2c;
    --warning-bg: #fcefd2;
    --warning-text: #6b4600;
    --danger-bg: #fce6e1;
    --danger-text: #8c2410;
    --danger-solid: #8c2410;
    --on-danger-solid: #ffffff;

    --shadow: 0 1px 2px rgba(20, 20, 20, 0.05);
    --shadow-raised: 0 12px 32px rgba(20, 20, 20, 0.16);
    --backdrop: rgba(12, 12, 13, 0.6);

    /* The current-turn card: warm yellow with black text in both themes. Overdue swaps in coral. */
    --hero-bg: #f5c542;
    --hero-border: #e3b22e;
    --on-hero: #141210;
    --on-hero-soft: #3d3010;
    --hero-ring: rgba(20, 18, 16, 0.18);
    --hero-tile: #ecb92c;
    --hero-tile-text: #141210;
    --hero-tile-muted: #3d3010;
    --hero-button: #141210;
    --on-hero-button: #f8d466;
    --overdue-bg: #ff8566;
    --overdue-border: #f2714f;
    --overdue-tile: #f56f4e;
    --overdue-tile-text: #141210;
    --overdue-tile-muted: #3a1308;

    /* Avatars: six warm neutrals within the brand (yellow, amber, sand, stone, clay, charcoal) */
    --tone-1-bg: #fbefc7;
    --tone-1-fg: #5c4400;
    --tone-2-bg: #fde3cc;
    --tone-2-fg: #773b0b;
    --tone-3-bg: #efe6d6;
    --tone-3-fg: #574629;
    --tone-4-bg: #e6e4df;
    --tone-4-fg: #3d3b36;
    --tone-5-bg: #f6dcd3;
    --tone-5-fg: #7a301e;
    --tone-6-bg: #2a2824;
    --tone-6-fg: #f8d466;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0b0c;
    --surface: #161617;
    --surface-soft: #1e1e20;
    --surface-raised: #1c1c1e;
    --text: #f4f2ed;
    --muted: #a6a29a;
    --border: #2a2a2d;
    --hover-bg: #26262a;
    --input-bg: #111112;
    --input-border: #3a3a3f;
    --focus: #f5c542;

    --solid: #f5c542;
    --solid-hover: #ffd466;
    --on-solid: #141210;
    --accent: #f5c542;
    --accent-soft: #2b2512;
    --accent-text: #f7d062;
    --neutral-bg: #252528;
    --neutral-text: #d0ccc3;
    --note-bg: #1b1b1d;
    --tab-active-bg: #2b2512;
    --tab-active-text: #f7d062;

    --success-bg: #14301c;
    --success-text: #9fdcab;
    --warning-bg: #33280c;
    --warning-text: #f4cd6b;
    --danger-bg: #3b1915;
    --danger-text: #ffb7a8;
    --danger-solid: #ffb7a8;
    --on-danger-solid: #1a0b08;

    --shadow: none;
    --shadow-raised: 0 16px 40px rgba(0, 0, 0, 0.55);
    --backdrop: rgba(0, 0, 0, 0.72);
    --hero-border: #f5c542;
    --overdue-border: #ff8566;

    --tone-1-bg: #3a3012;
    --tone-1-fg: #f7d062;
    --tone-2-bg: #3d2715;
    --tone-2-fg: #f5b98a;
    --tone-3-bg: #302a20;
    --tone-3-fg: #e3d3b3;
    --tone-4-bg: #2c2c2f;
    --tone-4-fg: #d8d5ce;
    --tone-5-bg: #3b211b;
    --tone-5-fg: #f0b5a3;
    --tone-6-bg: #e9e4d8;
    --tone-6-fg: #1d1b16;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--fs-base)/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select {
    font: inherit;
  }

  [hidden] {
    display: none !important;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* Line icons take the text colour and size of their surroundings. */
  .icon {
    flex: none;
    width: 1.25em;
    height: 1.25em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: var(--space-3) var(--space-4) 96px;
  }

  /* Header */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2) var(--space-3);
    padding: var(--space-1) 0 var(--space-3);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  .brand h1 {
    margin: 0;
    font-size: var(--fs-xl);
    font-weight: var(--weight-heavy);
    letter-spacing: -0.03em;
  }

  .logo {
    width: 32px;
    height: 32px;
  }

  .logo-bg {
    fill: var(--hero-bg);
  }

  .logo-mark {
    fill: var(--on-hero);
  }

  .logo-door {
    fill: var(--hero-bg);
  }

  .env-badge {
    padding: 1px var(--space-2);
    border-radius: var(--radius-pill);
    background: #b45309;
    color: #fff;
    font-size: var(--fs-xs);
    font-weight: var(--weight-bold);
  }

  .beta-badge {
    padding: 0 var(--space-2);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-pill);
    color: var(--muted);
    font-size: 0.6875rem;
    font-weight: var(--weight-bold);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .top-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
  }

  .profile {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    max-width: 100%;
    min-height: var(--tap);
    padding: var(--space-1) var(--space-3) var(--space-1) var(--space-1);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .profile-text {
    display: grid;
    min-width: 0;
    line-height: 1.2;
  }

  .profile-name {
    overflow: hidden;
    max-width: 9rem;
    font-size: var(--fs-sm);
    font-weight: var(--weight-bold);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .profile-state {
    color: var(--muted);
    font-size: var(--fs-xs);
  }

  .theme-toggle {
    display: inline-flex;
    padding: 3px;
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
  }

  .theme-toggle button {
    min-height: 34px;
    padding: 2px var(--space-3);
    border: 0;
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--muted);
    font-size: var(--fs-sm);
    font-weight: var(--weight-medium);
    cursor: pointer;
  }

  .theme-toggle button[aria-pressed="true"] {
    background: var(--solid);
    color: var(--on-solid);
    font-weight: var(--weight-bold);
  }

  /* Section navigation: a bottom bar on phones, a pill row under the header on wider screens */
  .tabs {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 5;
    display: flex;
    gap: var(--space-1);
    padding: var(--space-1) var(--space-2) calc(var(--space-1) + env(safe-area-inset-bottom));
    border-top: var(--border-width) solid var(--border);
    background: var(--surface);
  }

  .tab {
    flex: 1 1 0;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: 2px;
    min-height: 56px;
    padding: var(--space-1) 2px;
    border: 0;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--muted);
    font-size: var(--fs-xs);
    font-weight: var(--weight-medium);
    cursor: pointer;
  }

  .tab-icon {
    width: 52px;
    height: 28px;
    padding: 4px 15px;
    border-radius: var(--radius-pill);
  }

  .tab[aria-current="page"] {
    color: var(--text);
    font-weight: var(--weight-bold);
  }

  .tab[aria-current="page"] .tab-icon {
    background: var(--tab-active-bg);
    color: var(--tab-active-text);
  }

  .beta-notice {
    margin: 0 0 var(--space-3);
    padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--note-bg);
    color: var(--text);
    font-size: var(--fs-md);
  }

  .beta-notice-body {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2) var(--space-4);
  }

  .beta-notice p {
    flex: 1 1 16rem;
    margin: 0;
  }

  .panel-title {
    margin: 0 0 var(--space-2);
    font-size: var(--fs-xl);
    font-weight: var(--weight-heavy);
    letter-spacing: -0.02em;
  }

  .who-note {
    margin: 0;
    color: var(--muted);
    font-size: var(--fs-sm);
  }

  /* Cards: one style everywhere (same radius and border); depth only for dialogs. */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-3);
  }

  .card {
    padding: var(--space-4);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    color: var(--muted);
    font-size: var(--fs-xs);
    font-weight: var(--weight-bold);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .eyebrow .icon {
    width: 1.35em;
    height: 1.35em;
  }

  .name {
    margin: 0;
    font-weight: var(--weight-heavy);
    overflow-wrap: anywhere;
  }

  /* Hero: the current cleaner, on warm yellow */
  .hero {
    --hero: var(--hero-bg);
    --tile: var(--hero-tile);
    --tile-text: var(--hero-tile-text);
    --tile-muted: var(--hero-tile-muted);
    padding: var(--space-4);
    border-color: var(--hero-border);
    background: var(--hero);
    color: var(--on-hero);
  }

  .hero.is-overdue {
    --hero: var(--overdue-bg);
    --tile: var(--overdue-tile);
    --tile-text: var(--overdue-tile-text);
    --tile-muted: var(--overdue-tile-muted);
    border-color: var(--overdue-border);
  }

  .hero .eyebrow {
    color: var(--on-hero-soft);
  }

  .hero-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
  }

  .hero-person {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin: var(--space-3) 0 var(--space-2);
  }

  .person-text {
    flex: 1 1 auto;
    min-width: 0;
  }

  .hero .name {
    font-size: var(--fs-hero);
    line-height: 1.05;
    letter-spacing: -0.035em;
  }

  .task {
    margin: 2px 0 0;
    color: var(--on-hero-soft);
    font-size: var(--fs-md);
    font-weight: var(--weight-medium);
  }

  .message {
    margin: 0 0 var(--space-3);
    font-size: var(--fs-base);
    font-weight: var(--weight-bold);
    text-wrap: balance;
  }

  .hero .facts {
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2);
  }

  .hero .facts > div {
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    background: var(--tile);
  }

  .hero .facts dt {
    color: var(--tile-muted);
  }

  .hero .facts dd {
    color: var(--tile-text);
  }

  .hero .badge,
  .hero .note {
    background: var(--tile);
    color: var(--tile-text);
  }

  /* "Cleaning impact" on a vacation card: folded away until asked for */
  .impact {
    margin-top: var(--space-2);
  }

  .impact summary {
    width: fit-content;
    min-height: 32px;
    padding: var(--space-1) 0;
    color: var(--accent-text);
    font-size: var(--fs-sm);
    font-weight: var(--weight-bold);
    cursor: pointer;
  }

  .impact .chips {
    margin-top: var(--space-1);
  }

  /* Avatars */
  .avatar {
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-weight: var(--weight-heavy);
  }

  .avatar-lg {
    width: 52px;
    height: 52px;
    font-size: 1.375rem;
    box-shadow: 0 0 0 3px var(--hero-ring);
  }

  .avatar-md {
    width: 36px;
    height: 36px;
    font-size: var(--fs-base);
  }

  .avatar-xl {
    width: 44px;
    height: 44px;
    font-size: var(--fs-lg);
  }

  .avatar .icon {
    width: 56%;
    height: 56%;
  }

  .avatar-sm {
    width: 28px;
    height: 28px;
    font-size: var(--fs-sm);
  }

  .avatar-none {
    background: var(--neutral-bg);
    color: var(--neutral-text);
  }

  .tone-1 { background: var(--tone-1-bg); color: var(--tone-1-fg); }
  .tone-2 { background: var(--tone-2-bg); color: var(--tone-2-fg); }
  .tone-3 { background: var(--tone-3-bg); color: var(--tone-3-fg); }
  .tone-4 { background: var(--tone-4-bg); color: var(--tone-4-fg); }
  .tone-5 { background: var(--tone-5-bg); color: var(--tone-5-fg); }
  .tone-6 { background: var(--tone-6-bg); color: var(--tone-6-fg); }

  /* Status and step chips */
  .badge,
  .step {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    font-size: var(--fs-xs);
    font-weight: var(--weight-bold);
    white-space: nowrap;
  }

  .step {
    background: var(--neutral-bg);
    color: var(--neutral-text);
  }

  .step.is-next {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  /* Facts and notes */
  .facts {
    display: grid;
    gap: var(--space-2);
    margin: 0;
  }

  .facts dt {
    font-size: var(--fs-xs);
    font-weight: var(--weight-medium);
  }

  .facts dd {
    margin: 1px 0 0;
    font-size: var(--fs-md);
    font-weight: var(--weight-bold);
  }

  .note {
    display: flex;
    align-items: flex-start;
    gap: var(--space-2);
    margin: var(--space-2) 0 0;
    padding: 6px var(--space-3);
    border-radius: var(--radius-md);
    background: var(--note-bg);
    font-size: var(--fs-sm);
  }

  .note .icon {
    margin-top: 1px;
    width: 1.15rem;
    height: 1.15rem;
  }

  /* Coming up: one compact avatar card per turn; each opens that roommate's profile */
  .section-title {
    margin: 0 0 var(--space-2);
  }

  .upcoming {
    min-width: 0;
  }

  /* On phones the cards scroll sideways inside the card, so the page itself never does. */
  .member-grid {
    display: flex;
    gap: var(--space-2);
    margin: 0 calc(var(--space-1) * -1);
    padding: var(--space-1) var(--space-1) var(--space-2);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scroll-padding: 0 var(--space-1);
    list-style: none;
  }

  .member-grid > li {
    flex: 0 0 min(68%, 14.5rem);
    min-width: 0;
    scroll-snap-align: start;
  }

  .member-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
    width: 100%;
    height: 100%;
    min-height: var(--tap);
    padding: var(--space-3);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .member-card-body {
    display: grid;
    flex: 1 1 auto;
    gap: 2px;
    min-width: 0;
  }

  .member-card-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-1) var(--space-2);
  }

  .member-card .name {
    font-weight: var(--weight-bold);
  }

  .member-card .note {
    margin-top: var(--space-1);
    padding: var(--space-1) var(--space-2);
    background: var(--surface);
    font-size: var(--fs-xs);
  }

  .when {
    margin: 0;
    color: var(--muted);
    font-size: var(--fs-sm);
    font-weight: var(--weight-medium);
    font-variant-numeric: tabular-nums;
  }

  /* Cleaning photos: the offer after a cleaning, the buttons in History and profiles, the dialog and the gallery */
  .slot:empty {
    display: none;
  }

  .photo-prompt {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3) var(--space-4);
    padding: var(--space-3) var(--space-4);
  }

  .photo-prompt > .icon {
    width: 1.75rem;
    height: 1.75rem;
    color: var(--accent-text);
  }

  .photo-prompt-text {
    flex: 1 1 14rem;
    min-width: 0;
  }

  .photo-prompt-title {
    margin: 0;
    font-size: var(--fs-base);
  }

  .photo-prompt-text p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: var(--fs-sm);
  }

  .photo-prompt-actions,
  .photo-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .photo-actions {
    margin-top: var(--space-1);
  }

  .history-table td[data-label="Status"] .photo-actions {
    margin-top: var(--space-2);
  }

  .member-recent-end {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-2);
  }

  .photo-frame {
    margin: var(--space-3) 0 var(--space-1);
    overflow: hidden;
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
  }

  .photo-img {
    display: block;
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
  }

  .skeleton-photo {
    height: 14rem;
    margin-top: var(--space-3);
  }

  .skeleton-tile {
    aspect-ratio: 1;
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-2);
    margin: 0 0 var(--space-3);
    padding: 0;
    list-style: none;
  }

  .photo-tile {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 1;
    padding: 0;
    overflow: hidden;
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--text);
    cursor: pointer;
  }

  .photo-tile .photo-img {
    height: 100%;
    max-height: none;
    object-fit: cover;
  }

  .photo-tile.is-missing {
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: var(--fs-xs);
    cursor: default;
  }

  .photo-caption {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    padding: 2px var(--space-1);
    background: var(--surface);
    color: var(--text);
    font-size: 0.6875rem;
    font-weight: var(--weight-medium);
    text-align: center;
  }

  /* Member profile and avatar picker (a dialog) */
  .member-head {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }

  .member-head .avatar-lg {
    box-shadow: none;
  }

  .member-head .name {
    margin: 0 0 var(--space-1);
    font-size: var(--fs-xl);
  }

  .member-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-2);
    margin: 0 0 var(--space-4);
  }

  .member-stat {
    min-width: 0;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
  }

  .member-stat dt {
    color: var(--muted);
    font-size: var(--fs-xs);
    font-weight: var(--weight-medium);
  }

  .member-stat dd {
    margin: 1px 0 0;
    font-size: var(--fs-lg);
    font-weight: var(--weight-heavy);
    overflow-wrap: anywhere;
  }

  .member-stat-hint {
    display: block;
    color: var(--muted);
    font-size: var(--fs-xs);
  }

  @media (max-width: 479px) {
    .member-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .member-stat:last-child {
      grid-column: 1 / -1;
    }
  }

  .member-recent {
    display: grid;
    margin: 0 0 var(--space-4);
    padding: 0;
    list-style: none;
  }

  .member-recent li {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-1) var(--space-3);
    padding: 10px 0;
    border-top: var(--border-width) solid var(--border);
  }

  .member-recent-weekend {
    font-size: var(--fs-md);
    font-weight: var(--weight-bold);
  }

  .member-empty {
    margin: 0;
    color: var(--muted);
  }

  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-2);
    margin-top: var(--space-4);
  }

  .avatar-choice {
    display: grid;
    justify-items: center;
    gap: var(--space-1);
    padding: var(--space-2);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--text);
    cursor: pointer;
  }

  .avatar-choice[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  .avatar-choice[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .avatar-choice-label {
    font-size: var(--fs-xs);
    font-weight: var(--weight-medium);
  }

  .footnote {
    margin: 0;
    color: var(--muted);
    font-size: var(--fs-xs);
    text-align: center;
  }

  /* Empty and error states */
  .state {
    padding: 32px var(--space-5);
    text-align: center;
  }

  .state h2 {
    margin: 0 0 var(--space-2);
    font-size: var(--fs-lg);
  }

  .state p {
    margin: 0 auto var(--space-4);
    max-width: 32rem;
    color: var(--muted);
  }

  .state .code {
    margin: var(--space-4) 0 0;
    font-size: var(--fs-sm);
  }

  .state-compact {
    padding: var(--space-5) var(--space-4);
  }

  .state-compact h3 {
    margin: 0 0 var(--space-1);
    font-size: var(--fs-base);
  }

  .state-compact p {
    margin-bottom: 0;
  }

  .state-compact .button {
    margin-top: var(--space-3);
  }

  /* Buttons: solid (black in Light, yellow in Dark), quiet (outlined) and small. */
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: var(--tap);
    padding: 10px var(--space-5);
    border: var(--border-width) solid transparent;
    border-radius: var(--radius-pill);
    background: var(--solid);
    color: var(--on-solid);
    font-weight: var(--weight-bold);
    cursor: pointer;
  }

  .button-quiet {
    border-color: var(--border);
    background: var(--surface-soft);
    color: var(--text);
  }

  .button-small {
    min-height: 36px;
    padding: 6px 14px;
    font-size: var(--fs-sm);
  }

  .button-small .icon {
    width: 1.1rem;
    height: 1.1rem;
  }

  .button-danger {
    color: var(--danger-text);
  }

  .button-danger-solid {
    background: var(--danger-solid);
    color: var(--on-danger-solid);
  }

  /* Disabled keeps its colours, faded, so a yellow button never carries grey text. */
  .button[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .mark-button {
    width: 100%;
    margin-top: var(--space-3);
    background: var(--hero-button);
    color: var(--on-hero-button);
    font-size: var(--fs-base);
  }

  /* Banner after saving, and the dialogs */
  .notice {
    margin: 0;
    padding: 10px var(--space-4);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    font-size: var(--fs-md);
    font-weight: var(--weight-medium);
  }

  .notice-success {
    border-color: transparent;
    background: var(--success-bg);
    color: var(--success-text);
  }

  .notice-warning {
    border-color: transparent;
    background: var(--warning-bg);
    color: var(--warning-text);
  }

  .notice-info {
    background: var(--note-bg);
    color: var(--text);
  }

  .notice-error {
    border-color: transparent;
    background: var(--danger-bg);
    color: var(--danger-text);
  }

  .dialog {
    width: min(92vw, 420px);
    padding: 0;
    border: var(--border-width) solid var(--border);
    border-radius: 20px;
    background: var(--surface-raised);
    color: var(--text);
    box-shadow: var(--shadow-raised);
  }

  .dialog::backdrop {
    background: var(--backdrop);
  }

  .dialog-body {
    padding: var(--space-6) var(--space-5) var(--space-5);
    text-align: center;
  }

  .dialog-body h2 {
    margin: 0 0 var(--space-2);
    font-size: var(--fs-xl);
    letter-spacing: -0.015em;
  }

  .dialog-body p {
    margin: 0 auto var(--space-4);
    color: var(--muted);
  }

  .dialog-actions {
    display: grid;
    gap: var(--space-2);
  }

  .dialog-wide {
    width: min(94vw, 520px);
  }

  .dialog-scroll {
    max-height: 82vh;
    overflow-y: auto;
    text-align: left;
  }

  .dialog-scroll .dialog-actions {
    margin-top: var(--space-4);
  }

  /* Page heads: title and one-line intro, with the page's main action on the right */
  .vacation-top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .vacation-top > div {
    flex: 1 1 18rem;
    min-width: 0;
  }

  .vacation-top .panel-title {
    margin-bottom: 2px;
  }

  .vacation-intro {
    margin: 0;
    max-width: 34rem;
    color: var(--muted);
    font-size: var(--fs-md);
  }

  /* Vacations: compact cards, grouped by state */
  .vacation-group .section-title {
    margin-bottom: var(--space-2);
  }

  .vacation-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-2);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .vacation-card {
    padding: var(--space-3) var(--space-4);
  }

  .vacation-head {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  .vacation-head .name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: var(--fs-base);
    font-weight: var(--weight-bold);
  }

  .badge-away {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .badge-upcoming {
    background: var(--neutral-bg);
    color: var(--neutral-text);
  }

  .badge-returned {
    border: var(--border-width) solid var(--border);
    background: var(--surface-soft);
    color: var(--muted);
  }

  .vacation-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 2px var(--space-5);
    margin: var(--space-2) 0 0;
  }

  .vacation-facts dt {
    color: var(--muted);
    font-size: var(--fs-xs);
    font-weight: var(--weight-medium);
  }

  .vacation-facts dd {
    margin: 0;
    font-size: var(--fs-md);
    font-weight: var(--weight-bold);
    font-variant-numeric: tabular-nums;
  }

  .vacation-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: var(--space-3);
  }

  .vacation-note {
    margin: var(--space-3) 0 0;
    color: var(--muted);
  }

  /* "Who's away" on the Schedule page */
  .away-card {
    padding: var(--space-3) var(--space-4);
  }

  .away-list {
    display: grid;
    gap: 6px;
    margin: var(--space-2) 0 0;
    padding: 0;
    list-style: none;
  }

  .away-item {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-1) 10px;
  }

  .away-item .name {
    font-size: var(--fs-md);
    font-weight: var(--weight-bold);
  }

  .away-when {
    color: var(--muted);
    font-size: var(--fs-sm);
  }

  .away-empty {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
    margin: 6px 0 0;
    color: var(--muted);
    font-size: var(--fs-md);
  }

  /* Small labels: the weekends a vacation touches */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: var(--space-3) 0 0;
    padding: 0;
    list-style: none;
  }

  .chips .chip {
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    background: var(--neutral-bg);
    color: var(--neutral-text);
    font-size: var(--fs-xs);
    font-weight: var(--weight-medium);
  }

  .chips .chip-skipped {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  /* Forms */
  .field {
    display: grid;
    gap: 6px;
    margin-top: var(--space-4);
  }

  .field label {
    color: var(--muted);
    font-size: var(--fs-sm);
    font-weight: var(--weight-medium);
  }

  .date-input,
  .text-input {
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    border: var(--border-width) solid var(--input-border);
    border-radius: var(--radius-md);
    background: var(--input-bg);
    color: var(--text);
    font: inherit;
    font-size: var(--fs-base); /* 16px keeps iOS from zooming into the field */
  }

  .date-input:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .text-input:disabled {
    opacity: 0.7;
  }

  .form-error {
    margin: var(--space-4) 0 0;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    background: var(--danger-bg);
    color: var(--danger-text);
    font-weight: var(--weight-medium);
  }

  /* Sign-in and first password: one calm card, centred, with large touch targets */
  .auth-screen {
    display: grid;
    justify-items: center;
    padding: var(--space-6) 0 48px;
  }

  .auth-card {
    width: 100%;
    max-width: 25rem;
    padding: 28px var(--space-6);
  }

  .auth-head {
    text-align: center;
  }

  .auth-head h2 {
    margin: 0 0 var(--space-1);
    font-size: 1.625rem;
    font-weight: var(--weight-heavy);
    letter-spacing: -0.025em;
  }

  .auth-head h2::after {
    content: "";
    display: block;
    width: 32px;
    height: 4px;
    margin: 10px auto 0;
    border-radius: var(--radius-pill);
    background: var(--accent);
  }

  .auth-head p,
  .auth-help {
    margin: 0;
    color: var(--muted);
  }

  .auth-head p {
    margin-top: var(--space-3);
  }

  .auth-form {
    display: grid;
  }

  .auth-submit {
    width: 100%;
    margin-top: var(--space-5);
  }

  .auth-help {
    margin-top: 18px;
    font-size: var(--fs-sm);
    text-align: center;
  }

  /* While the server checks the password the button stays readable and plainly busy. */
  .auth-submit:disabled {
    background: var(--solid);
    color: var(--on-solid);
    opacity: 0.8;
    cursor: progress;
  }

  .password-field {
    position: relative;
  }

  .password-field .text-input {
    padding-right: 76px;
  }

  .password-toggle {
    position: absolute;
    top: 50%;
    right: 6px;
    min-width: 60px;
    min-height: 36px;
    padding: var(--space-1) 10px;
    border: 0;
    border-radius: var(--radius-sm);
    background: var(--neutral-bg);
    color: var(--neutral-text);
    font-size: var(--fs-sm);
    font-weight: var(--weight-bold);
    transform: translateY(-50%);
    cursor: pointer;
  }

  .field-hint {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: var(--fs-sm);
  }

  .auth-status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: var(--space-4) 0 0;
    padding: 10px var(--space-3);
    border-radius: var(--radius-md);
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: var(--weight-medium);
  }

  .spinner {
    flex: none;
    width: 18px;
    height: 18px;
    border: 3px solid var(--accent);
    border-right-color: transparent;
    border-radius: 50%;
  }

  .link-button {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    min-height: var(--tap);
    padding: var(--space-1) var(--space-2);
    border: 0;
    background: none;
    color: var(--accent-text);
    font-weight: var(--weight-bold);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* Profile */
  .profile-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-3);
    margin: var(--space-1) 0 var(--space-4);
    text-align: left;
  }

  .profile-card .name {
    margin: 0;
    color: var(--text);
    font-size: var(--fs-lg);
    font-weight: var(--weight-bold);
    overflow-wrap: anywhere;
  }

  .profile-role {
    margin: var(--space-1) 0 0;
    color: var(--muted);
    font-size: var(--fs-sm);
  }

  .badge-role {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .profile-note {
    margin: 0;
    color: var(--muted);
    font-size: var(--fs-sm);
  }

  .profile-admin {
    margin: 0 0 var(--space-3);
  }

  .profile-admin-button {
    width: 100%;
  }

  /* Admin and Swaps: one compact card per account or swap */
  .account-list {
    display: grid;
    gap: var(--space-2);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .account-card {
    padding: var(--space-3) var(--space-4);
  }

  .account-head {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
  }

  .account-text {
    min-width: 0;
  }

  .account-text .name {
    margin: 0;
    color: var(--text);
    font-weight: var(--weight-bold);
    overflow-wrap: anywhere;
  }

  .you,
  .account-meta,
  .account-hint {
    color: var(--muted);
    font-size: var(--fs-sm);
    font-weight: 400;
  }

  .account-meta {
    margin: 1px 0 0;
    overflow-wrap: anywhere;
  }

  .account-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0 0;
  }

  .badge-account.tone-ok {
    background: var(--success-bg);
    color: var(--success-text);
  }

  .badge-account.tone-wait,
  .badge-account.tone-off {
    background: var(--neutral-bg);
    color: var(--neutral-text);
  }

  .badge-account.tone-warn {
    background: var(--warning-bg);
    color: var(--warning-text);
  }

  .account-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: var(--space-3);
  }

  .account-hint {
    margin: 10px 0 0;
  }

  .swap-line {
    margin: 6px 0 0;
    font-size: var(--fs-md);
    overflow-wrap: anywhere;
  }

  .swap-preview {
    margin: var(--space-4) 0 0;
    padding: var(--space-3) 14px;
    border-radius: var(--radius-md);
    background: var(--accent-soft);
    color: var(--text);
  }

  .swap-preview .who-note {
    margin-top: var(--space-2);
  }

  .role-choice {
    margin: var(--space-4) 0 0;
    padding: 0;
    border: 0;
  }

  .role-choice legend {
    margin-bottom: 6px;
    color: var(--muted);
    font-size: var(--fs-sm);
    font-weight: var(--weight-medium);
  }

  .role-option {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: var(--tap);
    margin-top: 6px;
    padding: var(--space-2) var(--space-3);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
  }

  .role-option input {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--accent);
  }

  .dialog-body .temp-password {
    margin: var(--space-4) 0 var(--space-2);
    padding: 14px;
    border: var(--border-width) dashed var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-soft);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: var(--weight-bold);
    letter-spacing: 0.08em;
    text-align: center;
    word-break: break-all;
    user-select: all;
  }

  .copy-status {
    min-height: 1.25em;
    margin: 6px 0 0;
    color: var(--muted);
    font-size: var(--fs-sm);
  }

  /* History: range chips, the table (stacked rows on phones) and pages */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: var(--space-1) 0;
  }

  .filter-bar .chip {
    min-height: 36px;
    padding: var(--space-1) 14px;
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: var(--fs-sm);
    font-weight: var(--weight-medium);
    cursor: pointer;
  }

  .filter-bar .chip[aria-pressed="true"] {
    border-color: var(--solid);
    background: var(--solid);
    color: var(--on-solid);
    font-weight: var(--weight-bold);
  }

  /* History / Leaderboard switch */
  .segmented {
    display: inline-flex;
    justify-self: start;
    padding: 3px;
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-pill);
    background: var(--surface);
  }

  .segment {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 38px;
    padding: var(--space-1) var(--space-4);
    border: 0;
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--muted);
    font-size: var(--fs-md);
    font-weight: var(--weight-medium);
    cursor: pointer;
  }

  .segment[aria-pressed="true"] {
    background: var(--solid);
    color: var(--on-solid);
    font-weight: var(--weight-bold);
  }

  /* The Clean League: a compact podium, then every roommate's standing */
  .podium {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--space-2);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .podium-place {
    flex: 1 1 6.5rem;
    min-width: 0;
  }

  .podium-card {
    display: grid;
    justify-items: center;
    gap: 2px;
    width: 100%;
    padding: var(--space-3) var(--space-2);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--text);
    text-align: center;
    font: inherit;
  }

  button.podium-card {
    cursor: pointer;
  }

  .podium-1 .podium-card {
    padding-block: var(--space-5) var(--space-4);
    border-color: var(--hero-border);
    background: var(--hero-bg);
    color: var(--on-hero);
  }

  .podium-3 .podium-card {
    padding-block: var(--space-2);
  }

  .podium-card .name {
    max-width: 100%;
    overflow: hidden;
    font-size: var(--fs-md);
