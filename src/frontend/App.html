<script>
// Page wiring: sign-in, the first password change, and the signed-in app (schedule, vacations, profile).
// Every server call carries the session token; who the roommate is always comes back from the server (`viewer`).
const appElement = document.getElementById('app');
const dialogElement = document.getElementById('confirm-dialog');
const vacationDialog = document.getElementById('vacation-dialog');
const profileDialog = document.getElementById('profile-dialog');
const adminDialog = document.getElementById('admin-dialog');
const swapDialog = document.getElementById('swap-dialog');
const memberDialog = document.getElementById('member-dialog');
const profileButton = document.getElementById('profile-button');
const betaNotice = document.getElementById('beta-notice');
const tabsElement = document.getElementById('tabs');
const authScreen = document.getElementById('auth-screen');
const mainElement = document.getElementById('main-content');
const panels = {
  schedule: document.getElementById('panel-schedule'),
  vacation: document.getElementById('panel-vacation'),
  swaps: document.getElementById('panel-swaps'),
  history: document.getElementById('panel-history'),
  admin: document.getElementById('panel-admin'), // not a tab: opened from Profile, for ADMIN only
};
let currentSchedule = null;
let viewer = null; // { roommate_id, name, role, must_change_password } as reported by the server
let authBusy = false;
// Bumped whenever the session starts or ends, so answers that arrive for an earlier session are ignored.
let sessionEpoch = 0;
let pendingClean = null;
let saving = false;
let notice = null;
let loadedAt = 0;
const STALE_AFTER_MS = 5 * 60 * 1000; // Coming back to Schedule or Vacation after this long fetches a fresh copy.

// Household vacations: loaded once after the first schedule answer, then after every vacation change.
let vacations = null;
let vacationStatus = 'idle'; // idle | loading | ready | error | network
let vacationsLoadedAt = 0;
let vacationNotice = null;
let vacationDraft = { start: '', back: '' };
let pendingVacationCancel = null;
let pendingEdit = null; // { vacation, draft } while the edit form is open
let pendingEnd = null;
let vacationBusy = false;
// Swaps: your requests and the turns that could be swapped; loaded when the Swaps tab is opened, then again once stale.
let swapData = null; // { swaps, turns }
let swapStatus = 'idle'; // idle | loading | ready | error | network
let swapsLoadedAt = 0;
let swapNotice = null;
let swapBusy = false;
let pendingSwap = null; // { kind: 'request', draft } or { kind: 'accept' | 'decline' | 'cancel', swap }
// Cleaning history: loaded when the History tab is first opened, then again once stale or after a cleaning.
let historyData = null;
let historyStatus = 'idle'; // idle | loading | ready | error | network
let historyLoadedAt = 0;
let historyRange = HISTORY_DEFAULT_RANGE; // the time range and page shown; the server filters and pages
let historyPage = 1;
let historyRequestId = 0; // an older answer never replaces a newer one
let historyExporting = false;
let historyNotice = null;
// History tab sections: 'log' (the table) or 'league' (the leaderboard, loaded when first opened, then again once stale).
let historySection = 'log';
let leagueData = null;
let leagueStatus = 'idle'; // idle | loading | ready | error | network
let leaguePeriod = LEAGUE_DEFAULT_PERIOD;
let leagueLoadedAt = 0;
let leagueRequestId = 0;
// Member profile dialog: { roommateId, name, status, data, picking, busy, notice } while open.
let member = null;
let memberRequestId = 0; // an older answer never replaces a newer one
// Admin section: the account list and the one open action (a form, a confirmation or a one-time password).
let adminAccounts = null;
let adminStatus = 'idle'; // idle | loading | ready | error | network
let adminNotice = null;
let adminBusy = false;
let pendingAdmin = null; // { kind, account, draft }
// Refusals that mean the page's copy is out of date: the form closes and the list is reloaded.
const STALE_VACATION_CODES = ['VACATION_CHANGED', 'VACATION_NOT_FOUND', 'RECORD_NOT_FOUND', 'VACATION_ENDED', 'NOT_YOUR_VACATION'];

function viewerId() {
  return viewer ? viewer.roommate_id : null;
}

// ---------- signed out / password change / signed in ----------

function errorCodeOf(result) {
  return result && result.ok === false && result.error && typeof result.error.code === 'string' ? result.error.code : null;
}

/**
 * Handles answers that are about the session rather than the request. Returns true when it took over the page:
 * an ended or unknown session goes back to sign-in, a pending temporary password goes to the password form.
 */
function handleSessionRefusal(result) {
  const code = errorCodeOf(result);
  if (SESSION_END_CODES.indexOf(code) !== -1) {
    endSession(code);
    return true;
  }
  if (code === 'PASSWORD_CHANGE_REQUIRED') {
    showPasswordChange('');
    return true;
  }
  return false;
}

function setSignedIn(signedIn) {
  authScreen.hidden = signedIn;
  tabsElement.hidden = !signedIn;
  mainElement.hidden = !signedIn;
  profileButton.hidden = !signedIn;
  betaNotice.hidden = !signedIn || readStored(BETA_STORAGE_KEY) === 'dismissed' || !betaNotice.innerHTML;
}

function focusById(id) {
  const element = document.getElementById(id);
  if (element && element.focus) element.focus();
}

function showSignIn(message, username) {
  authBusy = false;
  setSignedIn(false);
  authScreen.innerHTML = renderSignIn({ username: username || '', message: message || '' });
  focusById(username ? 'sign-in-password' : 'sign-in-username');
}

function showPasswordChange(message) {
  authBusy = false;
  closeDialogs();
  setSignedIn(false);
  authScreen.innerHTML = renderPasswordChange({ name: viewer ? displayName(viewer) : '', message: message || '' });
  focusById('current-password');
}

/** Forgets everything shown for the previous session, so the next person sees nothing of it. */
function resetSignedInState() {
  sessionEpoch++;
  currentSchedule = null;
  viewer = null;
  pendingClean = null;
  saving = false;
  notice = null;
  member = null;
  memberRequestId++;
  memberDialog.innerHTML = '';
  setAvatarDirectory([]);
  photoPrompt = null;
  photo = null;
  photoRequestId++;
  photoDialog.innerHTML = '';
  Object.keys(photoCache).forEach(function (key) {
    delete photoCache[key];
  });
  vacations = null;
  vacationStatus = 'idle';
  vacationNotice = null;
  vacationBusy = false;
  adminAccounts = null;
  adminStatus = 'idle';
  adminNotice = null;
  historyData = null;
  historyStatus = 'idle';
  historyRange = HISTORY_DEFAULT_RANGE;
  historyPage = 1;
  historyRequestId++;
  historyExporting = false;
  historyNotice = null;
  historySection = 'log';
  leagueData = null;
  leagueStatus = 'idle';
  leaguePeriod = LEAGUE_DEFAULT_PERIOD;
  leagueRequestId++;
  panels.history.innerHTML = '';
  swapData = null;
  swapStatus = 'idle';
  swapNotice = null;
  panels.swaps.innerHTML = '';
  closeDialogs();
  appElement.innerHTML = '';
  panels.vacation.innerHTML = '';
  panels.admin.innerHTML = '';
  panels.admin.hidden = true;
  refreshProfile();
}

function closeDialogs() {
  [dialogElement, vacationDialog, profileDialog, memberDialog, photoDialog].forEach(function (dialog) {
    if (dialog.open) dialog.close();
  });
  closeAdminDialog();
  closeSwapDialog();
  pendingVacationCancel = null;
  pendingEdit = null;
  pendingEnd = null;
}

function endSession(code) {
  clearSession();
  resetSignedInState();
  showSignIn(authMessage(code));
}

function enterApp() {
  sessionEpoch++;
  setSignedIn(true);
  authScreen.innerHTML = '';
  selectTab('schedule');
  renderVacationPanel();
  refreshProfile();
  loadSchedule();
}

function signIn() {
  if (authBusy) return;
  const username = document.getElementById('sign-in-username').value.trim();
  const password = document.getElementById('sign-in-password').value;
  if (!username || !password) {
    showSignIn(authMessage('INVALID_REQUEST'), username);
    return;
  }
  authBusy = true;
  authScreen.innerHTML = renderSignIn({ username: username, busy: true });
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch) return;
      if (result && result.ok === true && result.session && isUsableSession(result.session) && result.viewer) {
        saveSession(result.session);
        viewer = result.viewer;
        if (viewer.must_change_password === true) showPasswordChange('');
        else enterApp();
        return;
      }
      showSignIn(authMessage(errorCodeOf(result)), username);
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) showSignIn(authMessage('REQUEST_FAILED'), username);
    })
    .signIn({ username: username, password: password });
}

function changePassword() {
  if (authBusy) return;
  const current = document.getElementById('current-password').value;
  const next = document.getElementById('new-password').value;
  const repeat = document.getElementById('repeat-password').value;
  const problem = passwordChangeProblem(current, next, repeat);
  if (problem) {
    showPasswordChange(problem);
    return;
  }
  authBusy = true;
  authScreen.innerHTML = renderPasswordChange({ name: viewer ? displayName(viewer) : '', busy: true });
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch) return;
      if (result && result.ok === true && result.session && isUsableSession(result.session) && result.viewer) {
        saveSession(result.session);
        viewer = result.viewer;
        enterApp();
        return;
      }
      if (SESSION_END_CODES.indexOf(errorCodeOf(result)) !== -1) {
        endSession(errorCodeOf(result));
        return;
      }
      showPasswordChange(authMessage(errorCodeOf(result)));
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) showPasswordChange(authMessage('REQUEST_FAILED'));
    })
    .changePassword({ token: sessionToken(), current_password: current, new_password: next });
}

/** Signs out here at once; the server also ends this roommate's other sessions. */
function signOut() {
  const token = sessionToken();
  clearSession();
  resetSignedInState();
  showSignIn(authMessage('SIGNED_OUT'));
  if (token) google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).signOut({ token: token });
}

function togglePassword(button) {
  const input = document.getElementById(button.getAttribute('data-target'));
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  button.setAttribute('aria-pressed', show ? 'true' : 'false');
  button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  button.textContent = show ? 'Hide' : 'Show';
}

// ---------- schedule ----------

function show(html, busy) {
  panels.schedule.setAttribute('data-settled', 'false'); // New content gets its entrance animation once.
  appElement.innerHTML = html;
  appElement.setAttribute('aria-busy', busy ? 'true' : 'false');
}

function showResult(result, quiet) {
  if (handleSessionRefusal(result)) return;
  if (result && result.viewer && typeof result.viewer.roommate_id === 'string') viewer = result.viewer;
  // A quiet refresh keeps the page as it is unless a good schedule arrives.
  if (quiet && !isValidSchedule(result)) return;
  currentSchedule = isValidSchedule(result) ? result : null;
  if (currentSchedule) {
    loadedAt = Date.now();
    setAvatarDirectory(currentSchedule.roommates);
  }
  try {
    show(renderResult(result, viewerId(), notice, awayView(), renderPhotoPrompt(photoPrompt)), false);
  } catch (error) {
    show(renderProblem('UNEXPECTED_RESPONSE'), false);
  }
  if (quiet) panels.schedule.setAttribute('data-settled', 'true'); // updated in place, without the entrance animation
  notice = null; // A banner is shown once, with the refreshed schedule.
  refreshProfile();
  renderVacationPanel();
  if (vacationStatus === 'idle') loadVacations();
}

function showRequestFailure() {
  notice = null;
  show(renderProblem('REQUEST_FAILED'), false);
  if (vacationStatus === 'idle') loadVacations();
}

// The profile entry shows who the server says is signed in.
function refreshProfile() {
  profileButton.innerHTML = renderProfileButton(viewer);
  profileButton.setAttribute('aria-label', profileLabel(viewer));
}

// Navigation only shows and hides sections, so switching is instant. Leaving the schedule marks it settled, so coming
// back doesn't replay the entrance animation. Only an old schedule or an old vacation list is fetched again.
function selectTab(tab) {
  if (TABS.indexOf(tab) === -1) return;
  if (!panels.schedule.hidden) panels.schedule.setAttribute('data-settled', 'true');
  TABS.forEach(function (name) {
    panels[name].hidden = name !== tab;
  });
  panels.admin.hidden = true;
  Array.from(tabsElement.querySelectorAll('[data-tab]')).forEach(function (button) {
    button.setAttribute('aria-current', button.getAttribute('data-tab') === tab ? 'page' : 'false');
  });
  if (tab === 'schedule' && currentSchedule && !saving && Date.now() - loadedAt > STALE_AFTER_MS) loadSchedule();
  if (tab === 'vacation' && vacationStatus === 'ready' && !vacationBusy && Date.now() - vacationsLoadedAt > STALE_AFTER_MS) loadVacations();
  if (tab === 'swaps' && (swapStatus === 'idle' || (swapStatus === 'ready' && !swapBusy && Date.now() - swapsLoadedAt > STALE_AFTER_MS))) loadSwaps();
  if (tab === 'history' && historySection === 'league') openLeagueIfNeeded();
  else if (tab === 'history' && (historyStatus === 'idle' || (historyStatus === 'ready' && Date.now() - historyLoadedAt > STALE_AFTER_MS))) loadHistory();
}

function showBetaNoticeOnce() {
  if (readStored(BETA_STORAGE_KEY) === 'dismissed') return;
  betaNotice.innerHTML = renderBetaNotice();
  betaNotice.hidden = false;
}

function dismissBetaNotice() {
  writeStored(BETA_STORAGE_KEY, 'dismissed');
  betaNotice.innerHTML = '';
  betaNotice.hidden = true;
}

function openProfile() {
  if (!viewer) return;
  profileDialog.innerHTML = renderProfileDialog(viewer);
  if (!profileDialog.open) profileDialog.showModal();
}

// `quiet` refreshes in the background: the current schedule stays visible until the new one arrives, and a failed
// refresh leaves it in place.
function loadSchedule(quiet) {
  if (!quiet) show(renderLoading(), true);
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch === sessionEpoch) showResult(result, quiet === true);
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch && quiet !== true) showRequestFailure();
    })
    .getRotationSchedule({ token: sessionToken() });
}

function openConfirm() {
  const turn = currentSchedule && markableTurn(currentSchedule, viewerId());
  if (!turn || saving) return;
  pendingClean = { rotation_id: turn.rotation_id, due_at: turn.due_at };
  dialogElement.innerHTML = renderConfirmDialog(currentSchedule, viewerId());
  dialogElement.showModal();
}

function finishClean(result) {
  saving = false;
  if (historyStatus !== 'loading') historyStatus = 'idle'; // the next History visit shows the new record
  if (leagueStatus !== 'loading') leagueStatus = 'idle'; // and the league the new points
  pendingClean = null;
  notice = result;
  dialogElement.close();
  loadSchedule(); // Always refresh, so the page shows what the Sheet really says.
}

// The dialog is replaced by "Saving…" at once, so a second click cannot send a second request.
function submitClean() {
  if (!pendingClean || saving) return;
  saving = true;
  const request = { token: sessionToken(), rotation_id: pendingClean.rotation_id, due_at: pendingClean.due_at };
  const name = rosterName(currentSchedule, viewerId());
  const epoch = sessionEpoch;
  dialogElement.innerHTML = renderSaving();
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch) return;
      if (handleSessionRefusal(result)) return;
      // The cleaning is saved. A photo is only ever an optional offer, with no effect on what was just recorded.
      if (result && result.ok === true && typeof result.log_id === 'string' && LOG_ID_PATTERN.test(result.log_id)) photoPrompt = { logId: result.log_id };
      finishClean(cleanNotice(result, name));
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) finishClean(unknownCleanNotice());
    })
    .markCleaned(request);
}

// A tap can land on an icon inside a button, so the click is traced back to the element that carries the attribute.
function carrier(event, selector) {
  const target = event.target;
  if (!target) return null;
  const found = target.closest ? target.closest(selector) : target;
  return found && found.getAttribute ? found : null;
}

function actionOf(event) {
  const source = carrier(event, '[data-action]');
  return source ? source.getAttribute('data-action') : null;
}

// ---------- swaps (the server checks the session, ownership and status on every call) ----------

function swapView() {
  return {
    status: swapStatus === 'idle' ? 'loading' : swapStatus,
    swaps: (swapData && swapData.swaps) || [],
    turns: (swapData && swapData.turns) || [],
    viewerId: viewerId(),
    notice: swapNotice,
  };
}

function renderSwapsView() {
  panels.swaps.innerHTML = renderSwapsPanel(swapView());
}

function loadSwaps() {
  swapStatus = 'loading';
  renderSwapsView();
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      swapData = isValidSwapList(result) ? result : null;
      swapStatus = swapData ? 'ready' : 'error';
      swapsLoadedAt = Date.now();
      renderSwapsView();
    })
    .withFailureHandler(function () {
      if (epoch !== sessionEpoch) return;
      swapData = null;
      swapStatus = 'network';
      renderSwapsView();
    })
    .listSwaps({ token: sessionToken() });
}

function showSwapDialog(html) {
  swapDialog.innerHTML = html;
  if (!swapDialog.open) {
    swapDialog.showModal();
    return;
  }
  const target = swapDialog.querySelector ? swapDialog.querySelector('[autofocus]') : null;
  if (target && target.focus) target.focus();
}

function closeSwapDialog() {
  pendingSwap = null;
  swapBusy = false;
  swapDialog.innerHTML = '';
  if (swapDialog.open) swapDialog.close();
}

function findSwap(swapId) {
  return ((swapData && swapData.swaps) || []).filter(function (swap) {
    return swap.swap_id === swapId;
  })[0] || null;
}

function currentSwapChoices() {
  return swapChoices((swapData && swapData.turns) || [], viewerId());
}

function startSwapRequest() {
  const choices = currentSwapChoices();
  if (swapBusy || !choices.mine.length || !choices.theirs.length) return;
  pendingSwap = { kind: 'request', draft: { mine: choices.mine[0].due_at, theirs: choices.theirs[0].due_at } };
  swapNotice = null;
  renderSwapsView();
  showSwapDialog(renderSwapForm(choices, pendingSwap.draft, pickedName()));
}

/** A change in either choice replaces only the preview, so the select keeps its keyboard focus. */
function updateSwapPreview() {
  if (!pendingSwap || pendingSwap.kind !== 'request') return;
  const choices = currentSwapChoices();
  pendingSwap.draft = { mine: valueOf('swap-mine'), theirs: valueOf('swap-theirs') };
  const mine = choices.mine.filter(function (turn) { return turn.due_at === pendingSwap.draft.mine; })[0];
  const theirs = choices.theirs.filter(function (turn) { return turn.due_at === pendingSwap.draft.theirs; })[0];
  const slot = document.getElementById('swap-preview-slot');
  if (slot) slot.innerHTML = renderSwapPreview(mine, theirs, pickedName());
}

function askSwap(kind, swapId) {
  const swap = findSwap(swapId);
  if (!swap || swapBusy || swap.status !== 'pending') return;
  if (kind === 'accept' && swap.direction !== 'incoming') return;
  if (kind === 'decline' && swap.direction !== 'incoming') return;
  if (kind === 'cancel' && swap.direction !== 'outgoing') return;
  swapNotice = null;
  renderSwapsView();
  pendingSwap = { kind: kind, swap: swap };
  showSwapDialog(renderSwapConfirm(kind, swap));
}

/** One swap call. Answers for an earlier session are dropped; refusals about stale data reload the list. */
function runSwapCall(name, request, successText, refreshSchedule) {
  swapBusy = true;
  showSwapDialog(renderSwapBusy());
  const epoch = sessionEpoch;
  const finish = function (notice) {
    closeSwapDialog();
    swapNotice = notice;
    loadSwaps();
  };
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      const code = errorCodeOf(result);
      if (code) {
        finish({ kind: 'error', text: swapMessage(code) });
        return;
      }
      finish({ kind: 'success', text: successText });
      if (refreshSchedule) loadSchedule(true); // who cleans may have changed: refresh without blanking the page
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) finish({ kind: 'info', text: swapMessage('REQUEST_FAILED') });
    })[name](Object.assign({ token: sessionToken() }, request));
}

function sendSwapRequest() {
  if (!pendingSwap || pendingSwap.kind !== 'request' || swapBusy) return;
  const choices = currentSwapChoices();
  const draft = { mine: valueOf('swap-mine'), theirs: valueOf('swap-theirs') };
  const theirs = choices.theirs.filter(function (turn) { return turn.due_at === draft.theirs; })[0];
  const mine = choices.mine.filter(function (turn) { return turn.due_at === draft.mine; })[0];
  if (!mine || !theirs) return;
  runSwapCall('requestSwap', { your_due_at: mine.due_at, partner_id: theirs.owner.roommate_id, their_due_at: theirs.due_at },
    'Request sent to ' + (theirs.owner.name || 'your roommate') + '. Nothing changes until they accept.', false);
}

function confirmSwap() {
  if (!pendingSwap || !pendingSwap.swap || swapBusy) return;
  const swap = pendingSwap.swap;
  const kind = pendingSwap.kind;
  const partner = swapPartnerName(swap);
  const id = { swap_id: swap.swap_id };
  if (kind === 'accept') runSwapCall('acceptSwap', id, 'Swap accepted: you and ' + partner + ' trade those two weekends.', true);
  if (kind === 'decline') runSwapCall('declineSwap', id, 'Request declined.', false);
  if (kind === 'cancel') runSwapCall('cancelSwap', id, 'Request cancelled.', false);
}

function finishSwapDialog() {
  if (!swapBusy) closeSwapDialog();
}

// ---------- member profiles and avatars (the server checks the session; avatars can only be changed for yourself) ----------

function renderMemberView() {
  if (member) memberDialog.innerHTML = renderMemberDialog(member);
}

function showMemberDialog() {
  renderMemberView();
  if (!memberDialog.open) {
    memberDialog.showModal();
    return;
  }
  const target = memberDialog.querySelector ? memberDialog.querySelector('[autofocus]') : null;
  if (target && target.focus) target.focus();
}

function closeMember() {
  member = null;
  memberRequestId++;
  memberDialog.innerHTML = '';
  if (memberDialog.open) memberDialog.close();
}

// Only someone in the household list (or yourself) can be opened; the server decides what is shown.
function openMember(roommateId) {
  const known = (currentSchedule && currentSchedule.roommates.some(function (roommate) {
    return roommate.roommate_id === roommateId;
  })) || (viewer && roommateId === viewerId()) || (leagueData && leagueData.entries.some(function (entry) {
    return entry.roommate.roommate_id === roommateId && entry.roommate.active;
  }));
  if (!known) return;
  if (profileDialog.open) profileDialog.close();
  const listed = (currentSchedule && currentSchedule.roommates.filter(function (roommate) {
    return roommate.roommate_id === roommateId;
  })[0]) || (leagueData && leagueData.entries.filter(function (entry) {
    return entry.roommate.roommate_id === roommateId;
  }).map(function (entry) {
    return entry.roommate;
  })[0]);
  member = { roommateId: roommateId, name: listed ? listed.name : viewer ? viewer.name : '', status: 'loading', data: null, picking: false, busy: false, notice: null, gallery: { status: 'idle', photos: {} } };
  showMemberDialog();
  loadMember();
}

function loadMember() {
  if (!member) return;
  const current = member;
  current.status = 'loading';
  renderMemberView();
  const epoch = sessionEpoch;
  const requestId = ++memberRequestId;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || requestId !== memberRequestId || member !== current || handleSessionRefusal(result)) return;
      current.data = isValidMember(result) && result.member.roommate_id === current.roommateId ? result : null;
      current.status = current.data ? 'ready' : 'error';
      if (current.data) setAvatarFor(current.roommateId, current.data.member.avatar);
      showMemberDialog();
    })
    .withFailureHandler(function () {
      if (epoch !== sessionEpoch || requestId !== memberRequestId || member !== current) return;
      current.data = null;
      current.status = 'network';
      showMemberDialog();
    })
    .getMemberProfile({ token: sessionToken(), roommate_id: current.roommateId });
}

// A pick (or "Initial", which is '') is for the signed-in roommate only: the request carries no roommate at all.
function pickAvatar(avatarId) {
  if (!member || member.busy || member.status !== 'ready' || !member.data.member.is_you) return;
  if (avatarId !== '' && !avatarSpec(avatarId)) return;
  const current = member;
  current.busy = true;
  current.notice = null;
  renderMemberView();
  const epoch = sessionEpoch;
  const finish = function (notice, changedTo) {
    current.busy = false;
    current.notice = notice;
    if (changedTo !== undefined) {
      current.picking = false;
      current.data.member.avatar = changedTo;
      setAvatarFor(current.roommateId, changedTo);
      refreshAvatars();
    }
    if (member === current) showMemberDialog();
  };
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      if (result && result.ok === true) finish({ kind: 'success', text: 'Avatar updated.' }, avatarId === '' ? null : avatarId);
      else finish({ kind: 'error', text: memberErrorMessage(errorCodeOf(result)) });
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) finish({ kind: 'error', text: MEMBER_SAVE_FALLBACK });
    })
    .setMyAvatar({ token: sessionToken(), avatar: avatarId === '' ? null : avatarId });
}

// An avatar changed: redraw what is already on screen, without asking the server again.
function refreshAvatars() {
  refreshProfile();
  if (currentSchedule) {
    show(renderResult(currentSchedule, viewerId(), null, awayView(), renderPhotoPrompt(photoPrompt)), false);
    panels.schedule.setAttribute('data-settled', 'true');
  }
  renderVacationPanel();
  if (swapStatus === 'ready') renderSwapsView();
  if (historyStatus === 'ready' || leagueStatus === 'ready') renderHistoryView();
  if (adminStatus === 'ready') renderAdminView();
}

// ---------- cleaning photos (optional; the server checks the session, the cleaner and the rights on every call) ----------

const photoDialog = document.getElementById('photo-dialog');
const photoCamera = document.getElementById('photo-camera');
const photoGallery = document.getElementById('photo-gallery');
const LOG_ID_PATTERN = /^[A-Za-z0-9_-]{1,64}$/;
let photoPrompt = null; // { logId }: the offer shown on Schedule after a cleaning, until dismissed or used
let photo = null; // the open photo dialog: { mode, logId, title, stage, preview, base64, bytes, width, height, error, canDelete, confirmingDelete }
let photoRequestId = 0;
const photoCache = {}; // log_id -> data URI of photos already fetched this session (cleared on sign-out and on change)

function photoSlot() {
  return document.getElementById('photo-prompt-slot');
}

function renderPhotoPromptSlot() {
  const slot = currentSchedule ? photoSlot() : null;
  if (slot) slot.innerHTML = renderPhotoPrompt(photoPrompt);
}

function renderPhotoView() {
  if (photo) photoDialog.innerHTML = renderPhotoDialog(photo);
}

function showPhotoDialog() {
  renderPhotoView();
  if (!photoDialog.open) {
    photoDialog.showModal();
    return;
  }
  const target = photoDialog.querySelector ? photoDialog.querySelector('[autofocus]') : null;
  if (target && target.focus) target.focus();
}

function closePhoto() {
  photo = null;
  photoRequestId++;
  photoDialog.innerHTML = '';
  if (photoDialog.open) photoDialog.close();
}

/** The history or profile entry for a log, from what is loaded, for its caption and the rights the server reported. */
function findLogEntry(logId) {
  const fromHistory = ((historyData && historyData.entries) || []).filter(function (entry) {
    return entry.log_id === logId;
  })[0];
  if (fromHistory) return { weekend: fromHistory, name: displayName(fromHistory.roommate), flags: fromHistory };
  const fromProfile = member && member.data ? member.data.recent.filter(function (entry) {
    return entry.log_id === logId;
  })[0] : null;
  return fromProfile ? { weekend: fromProfile, name: member.data.member.name, flags: fromProfile } : null;
}

function photoTitle(found) {
  return found ? found.name + ' · ' + formatWeekend(found.weekend) : 'Cleaning photo';
}

// "add": only for your own completed cleaning (the buttons only appear when the server said so); "view": anyone's.
function openPhoto(mode, logId) {
  if (!LOG_ID_PATTERN.test(String(logId)) || !viewer) return;
  const found = findLogEntry(logId);
  if (mode === 'add' && !(found ? found.flags.can_add_photo : photoPrompt && photoPrompt.logId === logId)) return;
  if (mode === 'view' && found && !found.flags.has_photo) return;
  photo = { mode: mode, logId: logId, title: photoTitle(found), stage: mode === 'add' ? 'choose' : 'loading', preview: '', base64: '', bytes: 0, width: 0, height: 0,
    error: '', canDelete: Boolean(found && found.flags.can_delete_photo), confirmingDelete: false };
  showPhotoDialog();
  if (mode === 'view') loadPhoto();
}

function startPhotoFromPrompt(logId) {
  if (!photoPrompt || photoPrompt.logId !== logId) return;
  openPhoto('add', logId);
}

function dismissPhotoPrompt() {
  photoPrompt = null;
  renderPhotoPromptSlot();
}

/** Fetches one photo on demand (or from this session's cache). done(dataUri | null, code). */
function fetchPhoto(logId, done) {
  if (Object.prototype.hasOwnProperty.call(photoCache, logId)) return done(photoCache[logId], null);
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      if (isValidPhotoAnswer(result)) {
        photoCache[logId] = 'data:image/jpeg;base64,' + result.data;
        done(photoCache[logId], null);
      } else {
        done(null, errorCodeOf(result) || 'PHOTO_STORAGE_FAILED');
      }
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) done(null, 'PHOTO_STORAGE_FAILED');
    })
    .getCleaningPhoto({ token: sessionToken(), log_id: logId });
}

function loadPhoto() {
  if (!photo || photo.mode !== 'view') return;
  const current = photo;
  const requestId = ++photoRequestId;
  current.stage = 'loading';
  renderPhotoView();
  fetchPhoto(current.logId, function (src, code) {
    if (photo !== current || requestId !== photoRequestId) return;
    current.preview = src || '';
    current.stage = src ? 'ready' : 'error';
    current.error = src ? '' : photoMessage(code);
    showPhotoDialog();
  });
}

function pickPhoto(input) {
  if (!photo || photo.mode !== 'add' || (photo.stage !== 'choose' && photo.stage !== 'error' && photo.stage !== 'preview')) return;
  input.click();
}

// Camera or gallery gave a file: shrink it here, then show a preview. Nothing is sent yet.
function photoFileChosen(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || !photo || photo.mode !== 'add') return;
  const current = photo;
  current.stage = 'working';
  current.error = '';
  renderPhotoView();
  const requestId = ++photoRequestId;
  compressPhoto(file, function (error, result) {
    if (photo !== current || requestId !== photoRequestId) return;
    if (error) {
      current.stage = 'choose';
      current.error = error.code === 'PHOTO_TOO_LARGE' ? 'That photo is too big even after shrinking. Try another one.' : 'We couldn’t read that photo. Try a JPEG or PNG.';
    } else {
      current.stage = 'preview';
      current.preview = result.dataUrl;
      current.base64 = result.base64;
      current.bytes = result.bytes;
      current.width = result.width;
      current.height = result.height;
    }
    showPhotoDialog();
  });
}

function discardPhoto() {
  if (!photo || photo.mode !== 'add' || photo.stage === 'uploading' || photo.stage === 'working') return;
  photo.stage = 'choose';
  photo.preview = '';
  photo.base64 = '';
  photo.error = '';
  showPhotoDialog();
}

// An upload is separate from the cleaning, which is already saved: a failure here changes nothing else.
function uploadPhoto() {
  if (!photo || photo.mode !== 'add' || !photo.base64 || (photo.stage !== 'preview' && photo.stage !== 'error')) return;
  const current = photo;
  current.stage = 'uploading';
  renderPhotoView();
  const epoch = sessionEpoch;
  const fail = function (text) {
    if (photo !== current) return;
    current.stage = 'error';
    current.error = text;
    showPhotoDialog();
  };
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      if (result && result.ok === true) {
        photoChanged(current.logId, 'Photo added. Nicely done.');
        return;
      }
      fail(photoMessage(errorCodeOf(result)));
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) fail('We couldn’t confirm that the photo arrived. Check your connection, then try again. Your cleaning is safe.');
    })
    .attachCleaningPhoto({ token: sessionToken(), log_id: current.logId, photo: current.base64 });
}

function askDeletePhoto() {
  if (!photo || photo.mode !== 'view' || photo.stage !== 'ready' || !photo.canDelete) return;
  photo.confirmingDelete = true;
  showPhotoDialog();
}

function deletePhoto() {
  if (!photo || photo.mode !== 'view' || photo.stage !== 'ready' || !photo.canDelete || !photo.confirmingDelete) return;
  const current = photo;
  current.stage = 'deleting';
  renderPhotoView();
  const epoch = sessionEpoch;
  const fail = function (text) {
    if (photo !== current) return;
    current.stage = 'ready';
    current.confirmingDelete = false;
    current.error = text;
    showPhotoDialog();
  };
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      if (result && result.ok === true) {
        photoChanged(current.logId, 'Photo deleted.');
        return;
      }
      const code = errorCodeOf(result);
      if (code === 'PHOTO_NOT_FOUND') photoChanged(current.logId, 'That photo was already gone.');
      else fail(photoMessage(code));
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) fail('We couldn’t confirm that the photo was deleted. Try again.');
    })
    .deleteCleaningPhoto({ token: sessionToken(), log_id: current.logId });
}

// A photo was added or removed: close the dialog, forget what was cached, and refresh what is on screen.
function photoChanged(logId, text) {
  delete photoCache[logId];
  if (photoPrompt && photoPrompt.logId === logId) dismissPhotoPrompt();
  closePhoto();
  historyStatus = historyStatus === 'loading' ? 'loading' : 'idle';
  if (!panels.history.hidden && historySection === 'log') loadHistory();
  if (member && member.status === 'ready') {
    member.gallery = { status: 'idle', photos: {} };
    member.notice = { kind: 'success', text: text };
    loadMember();
  }
}

// "Show photos" on a profile: fetch that roommate's few recent photos now, not before.
function loadGallery() {
  if (!member || member.status !== 'ready' || (member.gallery && member.gallery.status !== 'idle')) return;
  const current = member;
  const ids = member.data.recent.filter(function (entry) {
    return entry.has_photo && LOG_ID_PATTERN.test(entry.log_id);
  }).map(function (entry) {
    return entry.log_id;
  });
  current.gallery = { status: ids.length ? 'loading' : 'ready', photos: {} };
  showMemberDialog();
  let waiting = ids.length;
  ids.forEach(function (logId) {
    fetchPhoto(logId, function (src) {
      if (member !== current) return;
      current.gallery.photos[logId] = src;
      waiting--;
      if (waiting === 0) current.gallery.status = 'ready';
      showMemberDialog();
    });
  });
}

photoCamera.addEventListener('change', function () {
  photoFileChosen(photoCamera);
});

photoGallery.addEventListener('change', function () {
  photoFileChosen(photoGallery);
});

photoDialog.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'photo-camera') pickPhoto(photoCamera);
  if (action === 'photo-gallery') pickPhoto(photoGallery);
  if (action === 'photo-upload') uploadPhoto();
  if (action === 'photo-discard') discardPhoto();
  if (action === 'photo-retry') loadPhoto();
  if (action === 'photo-delete') askDeletePhoto();
  if (action === 'photo-delete-confirm') deletePhoto();
  if (action === 'photo-keep' && photo) {
    photo.confirmingDelete = false;
    showPhotoDialog();
  }
  if (action === 'photo-close' && !(photo && (photo.stage === 'uploading' || photo.stage === 'deleting' || photo.stage === 'working'))) closePhoto();
});

// Escape closes the dialog, except while a photo is being worked on or sent.
photoDialog.addEventListener('cancel', function (event) {
  if (event.preventDefault) event.preventDefault();
  if (!(photo && (photo.stage === 'uploading' || photo.stage === 'deleting' || photo.stage === 'working'))) closePhoto();
});

// ---------- history (read-only) ----------

function renderHistoryView() {
  const data = historyData;
  panels.history.innerHTML = renderHistoryPanel({
    section: historySection,
    league: leagueView(),
    status: historyStatus === 'idle' ? 'loading' : historyStatus,
    range: historyRange,
    page: data ? data.page : historyPage,
    pages: data ? data.pages : 1,
    total: data ? data.total : 0,
    pageSize: data ? data.page_size : 25,
    entries: (data && data.entries) || [],
    exporting: historyExporting,
    notice: historyNotice,
  });
}

function loadHistory() {
  historyStatus = 'loading';
  historyNotice = null;
  renderHistoryView();
  const epoch = sessionEpoch;
  const requestId = ++historyRequestId;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || requestId !== historyRequestId || handleSessionRefusal(result)) return;
      historyData = isValidHistory(result) ? result : null;
      historyStatus = historyData ? 'ready' : 'error';
      if (historyData) {
        historyRange = historyData.range; // the server may have moved to the last page
        historyPage = historyData.page;
      }
      historyLoadedAt = Date.now();
      renderHistoryView();
    })
    .withFailureHandler(function () {
      if (epoch !== sessionEpoch || requestId !== historyRequestId) return;
      historyData = null;
      historyStatus = 'network';
      renderHistoryView();
    })
    .listCleaningHistory({ token: sessionToken(), range: historyRange, page: historyPage });
}

// Saves text as a file through a temporary link. Returns false when the browser cannot.
function saveTextFile(filename, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    if (typeof setTimeout === 'function') setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    else URL.revokeObjectURL(url);
    return true;
  } catch (error) {
    return false;
  }
}

function exportHistory() {
  if (historyExporting || historyStatus !== 'ready' || !historyData || historyData.total < 1) return;
  historyExporting = true;
  historyNotice = null;
  renderHistoryView();
  const epoch = sessionEpoch;
  const finish = function (notice) {
    historyExporting = false;
    historyNotice = notice;
    renderHistoryView();
  };
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      if (!isValidHistoryExport(result)) return finish({ kind: 'error', text: 'Couldn’t prepare the download. Try again in a moment.' });
      finish(saveTextFile(result.filename, result.csv) ? null : { kind: 'error', text: 'Your browser blocked the download. Try again, or use another browser.' });
    })
    .withFailureHandler(function () {
      if (epoch !== sessionEpoch) return;
      finish({ kind: 'error', text: 'Couldn’t prepare the download. Check your connection and try again.' });
    })
    .exportCleaningHistory({ token: sessionToken(), range: historyRange });
}

// ---------- vacations (always the signed-in roommate's own; the server takes who that is from the session) ----------

function pickedName() {
  return viewer ? displayName(viewer) : null;
}

function awayView() {
  return { status: vacationStatus === 'idle' ? 'loading' : vacationStatus, vacations: vacations || [], nowMs: Date.now() };
}

function renderVacationPanel() {
  const name = pickedName();
  panels.vacation.innerHTML = renderVacationOverview({
    status: vacationStatus === 'idle' ? 'loading' : vacationStatus,
    vacations: vacations || [],
    selectedId: name ? viewerId() : null,
    selectedName: name,
    notice: vacationNotice,
  });
}

// "Who's away" lives inside the schedule, so only its own slot is replaced.
function refreshAway() {
  const slot = currentSchedule ? document.getElementById('away-slot') : null;
  if (slot) slot.innerHTML = renderAwaySummary(awayView());
}

function loadVacations() {
  if (vacations === null) vacationStatus = 'loading';
  renderVacationPanel();
  refreshAway();
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      if (isValidVacationList(result)) {
        vacations = result.vacations;
        vacationStatus = 'ready';
        vacationsLoadedAt = Date.now();
      } else {
        vacations = null;
        vacationStatus = 'error';
      }
      renderVacationPanel();
      refreshAway();
    })
    .withFailureHandler(function () {
      if (epoch !== sessionEpoch) return;
      vacations = null;
      vacationStatus = 'network';
      renderVacationPanel();
      refreshAway();
    })
    .listVacations({ token: sessionToken() });
}

function retryVacations() {
  vacationNotice = null;
  vacations = null;
  loadVacations();
}

// autofocus only acts when a dialog opens, so new content in an open dialog moves the focus itself.
function showVacationDialog(html) {
  vacationDialog.innerHTML = html;
  if (!vacationDialog.open) {
    vacationDialog.showModal();
    return;
  }
  const target = vacationDialog.querySelector ? vacationDialog.querySelector('[autofocus]') : null;
  if (target && target.focus) target.focus();
}

function closeVacationDialog() {
  vacationDraft = { start: '', back: '' };
  pendingVacationCancel = null;
  pendingEdit = null;
  pendingEnd = null;
  if (vacationDialog.open) vacationDialog.close();
}

/** Your own vacation with this ID from the loaded list, in one of `states`, or null. */
function ownVacation(vacationId, states) {
  const vacation = vacations && vacations.find(function (candidate) {
    return candidate.vacation_id === vacationId;
  });
  return vacation && viewer && vacation.roommate_id === viewerId() && states.indexOf(vacation.state) !== -1 ? vacation : null;
}

function planVacation() {
  const name = pickedName();
  if (!name || vacationBusy) return;
  vacationNotice = null;
  renderVacationPanel();
  showVacationDialog(renderVacationForm(name, todayInBerlin(), vacationDraft, ''));
}

// After a change the dialog closes, the schedule and the list are reloaded, and the tab says what happened.
function afterVacationChange(result, successText) {
  vacationBusy = false;
  if (handleSessionRefusal(result)) return;
  closeVacationDialog();
  if (result && result.ok === true) {
    vacationNotice = { kind: 'success', text: successText };
    loadSchedule(true);
  } else if (result && result.ok === false && result.error) {
    vacationNotice = { kind: 'error', text: vacationErrorMessage(result.error.code) };
  } else {
    vacationNotice = { kind: 'info', text: 'We couldn’t confirm that it saved. Check the list before trying again.' };
  }
  loadVacations();
}

/** Runs one vacation call; answers for an earlier session are dropped. */
function runVacationCall(name, request, onResult) {
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch === sessionEpoch) onResult(result);
    })
    .withFailureHandler(function () {
      if (epoch === sessionEpoch) afterVacationChange(null, '');
    })[name](Object.assign({ token: sessionToken() }, request));
}

function submitVacation() {
  const name = pickedName();
  if (!name || vacationBusy) return;
  vacationDraft = { start: document.getElementById('vacation-start').value, back: document.getElementById('vacation-return').value };
  const problem = vacationFormProblem(vacationDraft.start, vacationDraft.back);
  if (problem) {
    showVacationDialog(renderVacationForm(name, todayInBerlin(), vacationDraft, problem));
    return;
  }
  vacationBusy = true;
  showVacationDialog(renderVacationSaving());
  runVacationCall('saveVacation', { start_date: vacationDraft.start, return_date: vacationDraft.back }, function (result) {
    if (errorCodeOf(result) && SESSION_END_CODES.concat(['PASSWORD_CHANGE_REQUIRED']).indexOf(errorCodeOf(result)) === -1) {
      vacationBusy = false;
      showVacationDialog(renderVacationForm(name, todayInBerlin(), vacationDraft, vacationErrorMessage(result.error.code)));
      return;
    }
    afterVacationChange(result, 'Vacation saved. Your turns while you are away are skipped.');
  });
}

function editVacation(vacationId) {
  const vacation = ownVacation(vacationId, ['upcoming', 'away']);
  if (!vacation || vacationBusy) return;
  vacationNotice = null;
  renderVacationPanel();
  pendingEdit = { vacation: vacation, draft: { start: berlinDateInput(vacation.start_date), back: berlinDateInput(vacation.return_date) } };
  showVacationDialog(renderVacationEditForm(vacation, todayInBerlin(), pendingEdit.draft, ''));
}

// Whether a refusal is explained inside the open dialog (rather than closing it).
function explainInDialog(result) {
  const code = errorCodeOf(result);
  return Boolean(code) && STALE_VACATION_CODES.indexOf(code) === -1 && SESSION_END_CODES.concat(['PASSWORD_CHANGE_REQUIRED']).indexOf(code) === -1;
}

// The request carries the dates the page showed, so the server refuses it if the vacation changed meanwhile.
function submitEdit() {
  if (!pendingEdit || vacationBusy || !viewer) return;
  const edit = pendingEdit;
  const started = edit.vacation.state === 'away';
  edit.draft = {
    start: started ? berlinDateInput(edit.vacation.start_date) : document.getElementById('vacation-start').value,
    back: document.getElementById('vacation-return').value,
  };
  const problem = vacationFormProblem(edit.draft.start, edit.draft.back);
  if (problem) {
    showVacationDialog(renderVacationEditForm(edit.vacation, todayInBerlin(), edit.draft, problem));
    return;
  }
  vacationBusy = true;
  showVacationDialog(renderVacationSaving());
  runVacationCall('updateVacation', {
    vacation_id: edit.vacation.vacation_id,
    start_date: edit.draft.start,
    return_date: edit.draft.back,
    seen_start: edit.vacation.start_date,
    seen_return: edit.vacation.return_date,
  }, function (result) {
    if (explainInDialog(result)) {
      vacationBusy = false;
      showVacationDialog(renderVacationEditForm(edit.vacation, todayInBerlin(), edit.draft, vacationErrorMessage(result.error.code)));
      return;
    }
    afterVacationChange(result, result && result.changed === false ? 'Nothing changed: those are already the dates.' : 'Vacation dates updated.');
  });
}

function askEndVacation(vacationId) {
  const vacation = ownVacation(vacationId, ['away']);
  if (!vacation || vacationBusy) return;
  vacationNotice = null;
  renderVacationPanel();
  pendingEnd = vacation;
  showVacationDialog(renderVacationEndConfirm(vacation, new Date(Date.now()).toISOString()));
}

function confirmEndVacation() {
  if (!pendingEnd || vacationBusy || !viewer) return;
  const vacation = pendingEnd;
  pendingEnd = null;
  vacationBusy = true;
  showVacationDialog(renderVacationSaving());
  runVacationCall('endVacation', { vacation_id: vacation.vacation_id, seen_start: vacation.start_date, seen_return: vacation.return_date }, function (result) {
    // A refusal (a processed turn, a recorded skip, ...) is explained where the roommate is looking.
    if (explainInDialog(result)) {
      vacationBusy = false;
      showVacationDialog(renderVacationEndProblem(result.error.code));
      return;
    }
    afterVacationChange(result, 'Welcome back! Today is your first day back.');
  });
}

// Delete: offered only for your own vacation that the server marked as safe to remove (`cancellable`); it asks first.
function askCancelVacation(vacationId) {
  const vacation = ownVacation(vacationId, ['upcoming', 'away', 'returned']);
  if (!vacation || vacationBusy || !vacation.cancellable) return;
  vacationNotice = null;
  renderVacationPanel();
  pendingVacationCancel = vacation;
  showVacationDialog(renderVacationCancelConfirm(vacation));
}

function confirmCancelVacation() {
  if (!pendingVacationCancel || vacationBusy || !viewer) return;
  const vacationId = pendingVacationCancel.vacation_id;
  pendingVacationCancel = null;
  vacationBusy = true;
  showVacationDialog(renderVacationSaving());
  runVacationCall('cancelVacation', { vacation_id: vacationId }, function (result) {
    afterVacationChange(result, 'Vacation deleted.');
  });
}


// ---------- admin section (the server checks the ADMIN role on every call) ----------

function adminView() {
  return { status: adminStatus === 'idle' ? 'loading' : adminStatus, accounts: adminAccounts || [], notice: adminNotice };
}

function renderAdminView() {
  panels.admin.innerHTML = renderAdminPanel(adminView());
}

function openAdmin() {
  if (!viewer || viewer.role !== 'ADMIN') return;
  if (profileDialog.open) profileDialog.close();
  if (!panels.schedule.hidden) panels.schedule.setAttribute('data-settled', 'true');
  TABS.forEach(function (name) {
    panels[name].hidden = true;
  });
  Array.from(tabsElement.querySelectorAll('[data-tab]')).forEach(function (button) {
    button.setAttribute('aria-current', 'false');
  });
  panels.admin.hidden = false;
  adminNotice = null;
  loadAccounts();
}

/** The server says this person is not (or no longer) an admin: leave the section and refresh who they are. */
function leaveAdminForbidden() {
  closeAdminDialog();
  adminAccounts = null;
  adminStatus = 'idle';
  panels.admin.innerHTML = '';
  if (viewer) viewer = Object.assign({}, viewer, { role: 'ROOMMATE' });
  refreshProfile();
  selectTab('schedule');
  loadSchedule(true);
}

function loadAccounts() {
  if (adminAccounts === null) adminStatus = 'loading';
  renderAdminView();
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      if (errorCodeOf(result) === 'FORBIDDEN') {
        leaveAdminForbidden();
        return;
      }
      adminAccounts = isValidAccountList(result) ? result.accounts : null;
      adminStatus = adminAccounts ? 'ready' : 'error';
      renderAdminView();
    })
    .withFailureHandler(function () {
      if (epoch !== sessionEpoch) return;
      adminAccounts = null;
      adminStatus = 'network';
      renderAdminView();
    })
    .adminListAccounts({ token: sessionToken() });
}

function findAccount(roommateId) {
  return (adminAccounts || []).filter(function (account) {
    return account.roommate_id === roommateId;
  })[0] || null;
}

function showAdminDialog(html) {
  adminDialog.innerHTML = html;
  if (!adminDialog.open) {
    adminDialog.showModal();
    return;
  }
  const target = adminDialog.querySelector ? adminDialog.querySelector('[autofocus]') : null;
  if (target && target.focus) target.focus();
}

/** Closing always wipes the dialog, so a temporary password shown in it is gone from the page. */
function closeAdminDialog() {
  const wasShowing = pendingAdmin && pendingAdmin.kind === 'shown';
  pendingAdmin = null;
  adminBusy = false;
  adminDialog.innerHTML = '';
  if (adminDialog.open) adminDialog.close();
  return wasShowing;
}

function valueOf(id) {
  const element = document.getElementById(id);
  return element && typeof element.value === 'string' ? element.value : '';
}

function chosenRole() {
  const admin = document.getElementById('admin-role-admin');
  return admin && admin.checked ? 'ADMIN' : 'ROOMMATE';
}

/** A suggestion only: the first name in lower case, letters and digits only. */
function suggestUsername(name) {
  const first = String(name || '').split(/\s+/)[0].normalize('NFD').toLowerCase().replace(/[^a-z0-9]/g, '');
  return /^[a-z]/.test(first) ? first.slice(0, 32) : '';
}

function askAdmin(kind, roommateId, role) {
  const account = findAccount(roommateId);
  if (!account || adminBusy) return;
  if (kind === 'provision') {
    pendingAdmin = { kind: 'provision', account: account, draft: { username: suggestUsername(account.name), role: 'ROOMMATE' } };
    showAdminDialog(renderProvisionForm(account, pendingAdmin.draft, ''));
    return;
  }
  pendingAdmin = { kind: kind === 'role' ? role : kind, account: account };
  showAdminDialog(renderAdminConfirm(pendingAdmin.kind, account, ''));
}

function startAddRoommate() {
  if (adminBusy) return;
  pendingAdmin = { kind: 'add', draft: { name: '', email: '', telegram: '', username: '', role: 'ROOMMATE' } };
  showAdminDialog(renderAddRoommateForm(pendingAdmin.draft, ''));
}

/** Re-shows the open form or confirmation with a problem, keeping what was typed. */
function showAdminProblem(action, message) {
  adminBusy = false;
  pendingAdmin = action;
  if (action.kind === 'add') showAdminDialog(renderAddRoommateForm(action.draft, message));
  else if (action.kind === 'provision') showAdminDialog(renderProvisionForm(action.account, action.draft, message));
  else showAdminDialog(renderAdminConfirm(action.kind, action.account, message));
}

function runAdminCall(name, request, action, successText, busyText) {
  adminBusy = true;
  showAdminDialog(renderAdminBusy(busyText));
  const epoch = sessionEpoch;
  google.script.run
    .withSuccessHandler(function (result) {
      if (epoch !== sessionEpoch || handleSessionRefusal(result)) return;
      const code = errorCodeOf(result);
      if (code === 'FORBIDDEN') {
        leaveAdminForbidden();
        return;
      }
      if (code) {
        showAdminProblem(action, adminMessage(code));
        return;
      }
      adminBusy = false;
      adminNotice = { kind: 'success', text: successText };
      if (result && result.ok === true && typeof result.temporary_password === 'string' && result.account) {
        pendingAdmin = { kind: 'shown', added: action.kind === 'add' };
        showAdminDialog(renderTemporaryPassword(result.account, result.temporary_password, result.expires_at));
        return;
      }
      closeAdminDialog();
      loadAccounts();
    })
    .withFailureHandler(function () {
      if (epoch !== sessionEpoch) return;
      closeAdminDialog();
      adminNotice = { kind: 'info', text: adminMessage('REQUEST_FAILED') };
      loadAccounts();
    })[name](Object.assign({ token: sessionToken() }, request));
}

function saveAddRoommate() {
  if (!pendingAdmin || pendingAdmin.kind !== 'add' || adminBusy) return;
  const action = pendingAdmin;
  action.draft = { name: valueOf('admin-name'), email: valueOf('admin-email'), telegram: valueOf('admin-telegram'), username: valueOf('admin-username'), role: chosenRole() };
  const problem = addRoommateProblem(action.draft);
  if (problem) {
    showAdminProblem(action, problem);
    return;
  }
  runAdminCall('adminAddRoommate', {
    name: action.draft.name, email: action.draft.email, telegram: action.draft.telegram, username: action.draft.username, role: action.draft.role,
  }, action, action.draft.name.trim() + ' was added to the rotation.', 'Adding the roommate and creating the account. This takes about 10 seconds…');
}

function saveProvision() {
  if (!pendingAdmin || pendingAdmin.kind !== 'provision' || adminBusy) return;
  const action = pendingAdmin;
  action.draft = { username: valueOf('admin-username'), role: chosenRole() };
  const problem = usernameProblem(action.draft.username);
  if (problem) {
    showAdminProblem(action, problem);
    return;
  }
  runAdminCall('adminProvisionAccount', { roommate_id: action.account.roommate_id, username: action.draft.username, role: action.draft.role },
    action, 'Account created for ' + action.account.name + '.', 'Creating the account. This takes a few seconds…');
}

function confirmAdmin() {
  if (!pendingAdmin || adminBusy) return;
  const action = pendingAdmin;
  const id = { roommate_id: action.account.roommate_id };
  const name = action.account.name;
  if (action.kind === 'reset') runAdminCall('adminResetSignIn', id, action, 'New temporary password for ' + name + '.', 'Creating a temporary password. This takes a few seconds…');
  if (action.kind === 'disable') runAdminCall('adminDisableSignIn', id, action, 'Sign-in disabled for ' + name + '.', 'Saving…');
  if (action.kind === 'end') runAdminCall('adminEndSessions', id, action, name + ' is signed out everywhere.', 'Saving…');
  if (action.kind === 'ADMIN' || action.kind === 'ROOMMATE') {
    runAdminCall('adminChangeRole', Object.assign({ role: action.kind }, id), action, name + ' is now ' + (action.kind === 'ADMIN' ? 'an admin.' : 'a roommate.'), 'Saving…');
  }
}

function copyTemporaryPassword() {
  const element = document.getElementById('temp-password');
  const status = document.getElementById('copy-status');
  const say = function (text) {
    if (status) status.textContent = text;
  };
  const text = element ? element.textContent : '';
  try {
    navigator.clipboard.writeText(text).then(function () {
      say('Copied.');
    }, function () {
      say('Copying isn’t allowed here: select the password and copy it.');
    });
  } catch (error) {
    say('Copying isn’t allowed here: select the password and copy it.');
  }
}

/** Done, Cancel or Escape: the dialog is wiped; after a one-time password the list (and schedule) refresh. */
function finishAdminDialog() {
  if (adminBusy) return;
  const added = pendingAdmin && pendingAdmin.added;
  if (closeAdminDialog()) {
    loadAccounts();
    if (added) loadSchedule(true);
  }
}

// ---------- events ----------

authScreen.addEventListener('submit', function (event) {
  if (event.preventDefault) event.preventDefault(); // the page never navigates; the form only enables Enter
  const form = event.target && event.target.getAttribute ? event.target.getAttribute('data-form') : null;
  if (form === 'sign-in') signIn();
  if (form === 'change-password') changePassword();
});

authScreen.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'toggle-password') togglePassword(carrier(event, '[data-action]'));
  if (action === 'sign-out' && !authBusy) signOut();
});

appElement.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'retry') loadSchedule();
  if (action === 'mark-cleaned') openConfirm();
  if (action === 'retry-vacations') retryVacations();
  if (action === 'open-member') openMember(carrier(event, '[data-action]').getAttribute('data-roommate-id'));
  if (action === 'photo-start') startPhotoFromPrompt(carrier(event, '[data-action]').getAttribute('data-log-id'));
  if (action === 'photo-dismiss') dismissPhotoPrompt();
});

panels.vacation.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'plan-vacation') planVacation();
  if (action === 'retry-vacations') retryVacations();
  if (action === 'cancel-vacation') askCancelVacation(carrier(event, '[data-action]').getAttribute('data-vacation-id'));
  if (action === 'edit-vacation') editVacation(carrier(event, '[data-action]').getAttribute('data-vacation-id'));
  if (action === 'end-vacation') askEndVacation(carrier(event, '[data-action]').getAttribute('data-vacation-id'));
});

panels.swaps.addEventListener('click', function (event) {
  const action = actionOf(event);
  const source = carrier(event, '[data-action]');
  const swapId = source ? source.getAttribute('data-swap-id') : null;
  if (action === 'swap-request') startSwapRequest();
  if (action === 'swap-retry') loadSwaps();
  if (action === 'swap-accept') askSwap('accept', swapId);
  if (action === 'swap-decline') askSwap('decline', swapId);
  if (action === 'swap-cancel') askSwap('cancel', swapId);
});

swapDialog.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'swap-send') sendSwapRequest();
  if (action === 'swap-confirm') confirmSwap();
  if (action === 'swap-close') finishSwapDialog();
});

swapDialog.addEventListener('change', function () {
  updateSwapPreview();
});

// Escape closes the dialog without a click (while saving it stays open).
swapDialog.addEventListener('cancel', function (event) {
  if (event.preventDefault) event.preventDefault();
  finishSwapDialog();
});

panels.history.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'retry-history') {
    loadHistory();
  } else if (action === 'history-range') {
    const range = carrier(event, '[data-range]');
    const picked = range ? range.getAttribute('data-range') : null;
    if (picked && picked !== historyRange && HISTORY_RANGES.some(function (option) { return option.id === picked; })) {
      historyRange = picked;
      historyPage = 1;
      loadHistory();
    }
  } else if (action === 'history-prev' && historyData && historyData.page > 1) {
    historyPage = historyData.page - 1;
    loadHistory();
  } else if (action === 'history-next' && historyData && historyData.page < historyData.pages) {
    historyPage = historyData.page + 1;
    loadHistory();
  } else if (action === 'download-history') {
    exportHistory();
  } else if (action === 'history-section') {
    const section = carrier(event, '[data-section]');
    const picked = section ? section.getAttribute('data-section') : null;
    if ((picked === 'log' || picked === 'league') && picked !== historySection) {
      historySection = picked;
      if (picked === 'league') openLeagueIfNeeded();
      else if (historyStatus === 'idle') loadHistory();
      renderHistoryView();
    }
  } else if (action === 'league-period') {
    const period = carrier(event, '[data-period]');
    const picked = period ? period.getAttribute('data-period') : null;
    if (picked && picked !== leaguePeriod && LEAGUE_PERIODS.some(function (option) { return option.id === picked; })) {
      leaguePeriod = picked;
      loadLeague();
    }
  } else if (action === 'retry-league') {
    loadLeague();
  } else if (action === 'open-member') {
    openMember(carrier(event, '[data-action]').getAttribute('data-roommate-id'));
  } else if (action === 'view-photo' || action === 'add-photo') {
    openPhoto(action === 'view-photo' ? 'view' : 'add', carrier(event, '[data-action]').getAttribute('data-log-id'));
  }
});

tabsElement.addEventListener('click', function (event) {
  const button = carrier(event, '[data-tab]');
  selectTab(button ? button.getAttribute('data-tab') : null);
});

betaNotice.addEventListener('click', function (event) {
  if (actionOf(event) === 'dismiss-beta') dismissBetaNotice();
});

profileButton.addEventListener('click', function () {
  openProfile();
});

profileDialog.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'close-profile') profileDialog.close();
  if (action === 'open-admin') openAdmin();
  if (action === 'open-member') openMember(carrier(event, '[data-action]').getAttribute('data-roommate-id'));
  if (action === 'sign-out') signOut();
});

memberDialog.addEventListener('click', function (event) {
  const action = actionOf(event);
  const source = carrier(event, '[data-action]');
  if (action === 'close-member' && !(member && member.busy)) closeMember();
  if (action === 'retry-member') loadMember();
  if (action === 'member-avatar' && member && member.status === 'ready' && member.data.member.is_you) {
    member.picking = true;
    member.notice = null;
    showMemberDialog();
  }
  if (action === 'member-back' && member && !member.busy) {
    member.picking = false;
    showMemberDialog();
  }
  if (action === 'pick-avatar') pickAvatar(source.getAttribute('data-avatar'));
  if (action === 'member-gallery') loadGallery();
  if (action === 'view-photo' || action === 'add-photo') openPhoto(action === 'view-photo' ? 'view' : 'add', source.getAttribute('data-log-id'));
});

// Escape closes the dialog (while saving an avatar it stays open).
memberDialog.addEventListener('cancel', function (event) {
  if (event.preventDefault) event.preventDefault();
  if (!(member && member.busy)) closeMember();
});

panels.admin.addEventListener('click', function (event) {
  const action = actionOf(event);
  const source = carrier(event, '[data-action]');
  const roommateId = source ? source.getAttribute('data-roommate-id') : null;
  if (action === 'admin-add') startAddRoommate();
  if (action === 'admin-retry') loadAccounts();
  if (action === 'admin-back') selectTab('schedule');
  if (action === 'admin-provision') askAdmin('provision', roommateId);
  if (action === 'admin-reset') askAdmin('reset', roommateId);
  if (action === 'admin-disable') askAdmin('disable', roommateId);
  if (action === 'admin-end-sessions') askAdmin('end', roommateId);
  if (action === 'admin-role') askAdmin('role', roommateId, source.getAttribute('data-role'));
});

adminDialog.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'admin-save-add') saveAddRoommate();
  if (action === 'admin-save-provision') saveProvision();
  if (action === 'admin-confirm') confirmAdmin();
  if (action === 'admin-copy') copyTemporaryPassword();
  if (action === 'admin-done' || action === 'admin-close') finishAdminDialog();
});

// Escape closes the dialog without a click: wipe it the same way (busy work keeps it open).
adminDialog.addEventListener('cancel', function (event) {
  if (adminBusy) {
    if (event.preventDefault) event.preventDefault();
    return;
  }
  if (event.preventDefault) event.preventDefault();
  finishAdminDialog();
});

vacationDialog.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'save-vacation') submitVacation();
  if (action === 'confirm-cancel-vacation') confirmCancelVacation();
  if (action === 'save-edit') submitEdit();
  if (action === 'confirm-end-vacation') confirmEndVacation();
  if (action === 'close-vacation' && !vacationBusy) closeVacationDialog();
});

dialogElement.addEventListener('click', function (event) {
  const action = actionOf(event);
  if (action === 'confirm-clean') submitClean();
  if (action === 'cancel-clean') dialogElement.close();
});

// ---------- start ----------

writeStored(LEGACY_PICK_KEY, null); // the old unverified name pick is no longer used
showBetaNoticeOnce();
bindThemeToggle(document.getElementById('theme-toggle'));
// A stored session is tried straight away: the schedule answer says who is signed in, or sends the page to sign-in.
if (readSession()) enterApp();
else showSignIn('');
</script>
